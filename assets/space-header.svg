<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="45%" stop-color="#0c102a"/>
      <stop offset="80%" stop-color="#121838"/>
      <stop offset="100%" stop-color="#070916"/>
    </linearGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebulaViolet" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0c102a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="75%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c102a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPink" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#7209b7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c102a" stop-opacity="0"/>
    </radialGradient>

    <!-- Meteor Trails -->
    <linearGradient id="meteorTrail1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="meteorTrail2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f72585" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0"/>
    </linearGradient>

    <!-- Planet Saturn Gradients -->
    <linearGradient id="saturnBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="saturnRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Crescent Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="spaceTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="35%" stop-color="#7aa2f7"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Bottom Wave Gradients -->
    <linearGradient id="bottomWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="bottomWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050714" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0d1124" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Star Glow Filters -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nebulaBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <!-- Rounded Banner Clip -->
    <clipPath id="headerClip">
      <rect x="0" y="0" width="1200" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#headerClip)">
    <!-- Base Deep Space Background -->
    <rect width="1200" height="260" fill="url(#spaceGradient)"/>

    <!-- Cosmic Nebulae with Gentle Breathing Animation -->
    <g filter="url(#nebulaBlur)">
      <circle cx="320" cy="110" r="170" fill="url(#nebulaViolet)">
        <animate attributeName="opacity" values="0.45;0.75;0.45" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="160;185;160" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="130" r="180" fill="url(#nebulaCyan)">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="r" values="170;195;170" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="70" r="140" fill="url(#nebulaPink)">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Constellation Lines (Delicate Background Geometry) -->
    <g stroke="#7aa2f7" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35">
      <line x1="120" y1="50" x2="220" y2="85"/>
      <line x1="220" y1="85" x2="290" y2="40"/>
      <line x1="290" y1="40" x2="380" y2="90"/>
      <line x1="820" y1="50" x2="910" y2="90"/>
      <line x1="910" y1="90" x2="1000" y2="45"/>
      <line x1="1000" y1="45" x2="1080" y2="80"/>
    </g>

    <!-- Celestial Body 1: Planet Saturn with Ring (Right Side) -->
    <g transform="translate(1040, 80)">
      <circle cx="0" cy="0" r="32" fill="#00f5d4" opacity="0.1" filter="url(#starGlow)"/>
      <path d="M -55 -6 A 58 16 0 0 1 55 -6" stroke="url(#saturnRing)" stroke-width="4.5" fill="none" opacity="0.65"/>
      <circle cx="0" cy="0" r="24" fill="url(#saturnBody)"/>
      <path d="M -16 -16 A 24 24 0 0 1 18 -14 A 20 20 0 0 0 -16 -16" fill="#00f5d4" opacity="0.4"/>
      <path d="M -58 0 A 60 18 0 0 0 58 0" stroke="url(#saturnRing)" stroke-width="5" fill="none">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Celestial Body 2: Crescent Moon (Left Side) -->
    <g transform="translate(150, 75)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.08" filter="url(#starGlow)"/>
      <path d="M -14 -18 A 22 22 0 1 0 14 18 A 18 18 0 1 1 -14 -18 Z" fill="url(#moonGrad)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
      </path>
      <circle cx="-5" cy="2" r="1.6" fill="#475569" opacity="0.6"/>
      <circle cx="-9" cy="-6" r="1.2" fill="#475569" opacity="0.5"/>
    </g>

    <!-- Twinkling Starfield (Various Frequencies and Sizes) -->
    <g fill="#ffffff">
      <circle cx="80" cy="40" r="1.5">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="140" r="1.3">
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="45" r="1.6">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="730" cy="115" r="1.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="45" r="1.8">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1130" cy="140" r="1.3">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <circle cx="120" cy="120" r="1.8" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="85" r="2.2" fill="#ffffff" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="90" r="1.5" fill="#c084fc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="35" r="1.9" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="80" r="1.4" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="50" r="2.0" fill="#7aa2f7" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="910" cy="90" r="1.6" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="45" r="2.2" fill="#ffffff" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#ffffff">
      <circle cx="50" cy="95" r="1.2">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="155" r="1.4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="290" cy="40" r="2.0" fill="#7aa2f7">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="140" r="1.1">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="150" r="1.3">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="870" cy="155" r="1.5">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="80" r="1.7" fill="#c084fc">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1160" cy="60" r="1.2">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Sparkling 4-Point Cosmic Star Crosses -->
    <g fill="#00f5d4" filter="url(#starGlow)">
      <path d="M 220 85 L 222 81 L 226 83 L 222 85 L 226 87 L 222 89 L 220 85 Z" transform="scale(1.4) translate(-40, -10)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 400 45 Q 400 51 406 51 Q 400 51 400 57 Q 400 51 394 51 Q 400 51 400 45 Z" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 800 35 Q 800 42 807 42 Q 800 42 800 49 Q 800 42 793 42 Q 800 42 800 35 Z" fill="#c084fc">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Shooting Stars / Meteors -->
    <!-- Meteor 1 (Cyan/White - Streaks across left to right) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-120 -30; 1320 230"
        keyTimes="0; 1"
        dur="5.5s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-80" y2="-15" stroke="url(#meteorTrail1)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.8" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 2 (Pink/Violet - Streaks across opposite direction) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="1300 -10; -150 210"
        keyTimes="0; 1"
        dur="7.5s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="70" y2="-13" stroke="url(#meteorTrail2)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- ================================================================= -->
    <!-- ✏️ EDIT JUDUL & SUB-JUDUL DI BAWAH INI (GAMPANG BANGET):           -->
    <!-- ================================================================= -->
    <g transform="translate(600, 115)">

      <!-- 1. JUDUL UTAMA (GANTI TEKS DI BAWAH INI JIKA INGIN MENGUBAH JUDUL): -->
      <!-- Ambient Glow Behind Text -->
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="5" fill="url(#spaceTitleGrad)" filter="url(#starGlow)" opacity="0.6">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
        WELCOME TO MY PROFILE
      </text>

      <!-- Crisp Main Text -->
      <text x="0" y="10" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="5" fill="url(#spaceTitleGrad)">
        WELCOME TO MY PROFILE
      </text>

      <!-- 2. SUB-JUDUL / NAMA (GANTI TEKS DI BAWAH INI JIKA INGIN MENGUBAH SUB-JUDUL): -->
      <text x="0" y="42" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#94a3b8" opacity="0.9">
        ★ NANDA ALREZEL RIFANIE ★
      </text>
    </g>
    <!-- ================================================================= -->

    <!-- Bottom Horizon: Layered Star Dust Waves -->
    <path d="M 0 225 Q 300 205 600 225 T 1200 225 L 1200 260 L 0 260 Z" fill="url(#bottomWave1)">
      <animate attributeName="d"
        values="M 0 225 Q 300 205 600 225 T 1200 225 L 1200 260 L 0 260 Z;
                M 0 220 Q 300 235 600 220 T 1200 220 L 1200 260 L 0 260 Z;
                M 0 225 Q 300 205 600 225 T 1200 225 L 1200 260 L 0 260 Z"
        dur="6s"
        repeatCount="indefinite"/>
    </path>
    <path d="M 0 238 Q 300 228 600 238 T 1200 238 L 1200 260 L 0 260 Z" fill="url(#bottomWave2)"/>
  </g>
</svg>
