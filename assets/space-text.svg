<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" width="100%" height="100%">
  <defs>
    <!-- Title Gradient (Identical to Header) -->
    <linearGradient id="spaceTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="35%" stop-color="#7aa2f7"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Star & Ambient Glow Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- ZERO-GRAVITY FLOATING ROOT CONTAINER           -->
  <!-- ============================================== -->
  <g>
    <!-- Ultra-Smooth Pure Sine Float (No CSS Conflict) -->
    <animateTransform attributeName="transform" type="translate"
      values="0 2.5; 0 -2.5; 0 2.5"
      dur="3.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Left Cosmic Twinkling Star (✦) -->
    <g transform="translate(55, 20)">
      <path d="M 0 -7 L 1.5 -1.5 L 7 0 L 1.5 1.5 L 0 7 L -1.5 1.5 L -7 0 L -1.5 -1.5 Z" fill="#00f5d4" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="1.3" fill="#ffffff"/>
    </g>

    <!-- Right Cosmic Twinkling Star (✦) -->
    <g transform="translate(445, 20)">
      <path d="M 0 -7 L 1.5 -1.5 L 7 0 L 1.5 1.5 L 0 7 L -1.5 1.5 L -7 0 L -1.5 -1.5 Z" fill="#c084fc" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="1.3" fill="#ffffff"/>
    </g>

    <!-- Ambient Micro Stardust -->
    <circle cx="85" cy="12" r="1.1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="415" cy="28" r="1.2" fill="#00f5d4">
      <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- ============================================== -->
    <!-- TEXT 1: MALAS NGODING? (SMOOTH CROSSFADE)      -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0; 0"
        keyTimes="0; 0.09; 0.44; 0.52; 0.95; 1"
        dur="6.5s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>

      <!-- Ambient Glow Behind Text (Matched with Header) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="url(#spaceTitleGrad)" filter="url(#starGlow)" opacity="0.6">
        MALAS NGODING?
      </text>
      <!-- Crisp Foreground Text (Matched with Header) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="url(#spaceTitleGrad)">
        MALAS NGODING?
      </text>
    </g>

    <!-- ============================================== -->
    <!-- TEXT 2: BUKA FACEBOOK SOLUSINYA                -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.46; 0.55; 0.91; 0.98; 1"
        dur="6.5s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>

      <!-- Ambient Glow Behind Text (Matched with Header) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="url(#spaceTitleGrad)" filter="url(#starGlow)" opacity="0.6">
        BUKA FACEBOOK SOLUSINYA
      </text>
      <!-- Crisp Foreground Text (Matched with Header) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="url(#spaceTitleGrad)">
        BUKA FACEBOOK SOLUSINYA
      </text>
    </g>
  </g>
</svg>
