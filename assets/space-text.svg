<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 34" width="100%" height="100%">
  <defs>
    <!-- Cosmic Neon Text Gradient -->
    <linearGradient id="cosmicTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="spaceTextGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starTwinkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Zero-Gravity Space Floating Animation -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 1; 0 -2.5; 0 1"
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Left Cosmic Twinkling Star -->
    <g transform="translate(68, 17)">
      <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z" fill="#00f5d4" filter="url(#starTwinkleGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.7;1.2;0.7" dur="2.1s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Right Cosmic Twinkling Star -->
    <g transform="translate(432, 17)">
      <path d="M 0 -6 L 1.2 -1.2 L 6 0 L 1.2 1.2 L 0 6 L -1.2 1.2 L -6 0 L -1.2 -1.2 Z" fill="#7aa2f7" filter="url(#starTwinkleGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.7;1.2;0.7" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Tiny Stardust Particles -->
    <circle cx="95" cy="11" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="405" cy="24" r="1.1" fill="#00f5d4">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.3s" repeatCount="indefinite"/>
    </circle>

    <!-- TEXT 1: MALAS NGODING? -->
    <g>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0; 0"
        keyTimes="0; 0.08; 0.45; 0.53; 0.95; 1"
        dur="6s"
        repeatCount="indefinite"/>
      <!-- Soft Starlight Glow Layer -->
      <text x="250" y="23" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace, Consolas, sans-serif"
        font-size="20" font-weight="700" letter-spacing="3"
        fill="#00f5d4" opacity="0.4" filter="url(#spaceTextGlow)">
        MALAS NGODING?
      </text>
      <!-- Crisp Foreground Text -->
      <text x="250" y="23" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace, Consolas, sans-serif"
        font-size="20" font-weight="700" letter-spacing="3"
        fill="url(#cosmicTextGrad)">
        MALAS NGODING?
      </text>
    </g>

    <!-- TEXT 2: BUKA FACEBOOK SOLUSINYA -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 0; 1; 1; 0"
        keyTimes="0; 0.47; 0.55; 0.63; 0.92; 1"
        dur="6s"
        repeatCount="indefinite"/>
      <!-- Soft Starlight Glow Layer -->
      <text x="250" y="23" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace, Consolas, sans-serif"
        font-size="19" font-weight="700" letter-spacing="2.5"
        fill="#00f5d4" opacity="0.4" filter="url(#spaceTextGlow)">
        BUKA FACEBOOK SOLUSINYA
      </text>
      <!-- Crisp Foreground Text -->
      <text x="250" y="23" text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace, Consolas, sans-serif"
        font-size="19" font-weight="700" letter-spacing="2.5"
        fill="url(#cosmicTextGrad)">
        BUKA FACEBOOK SOLUSINYA
      </text>
    </g>
  </g>
</svg>
