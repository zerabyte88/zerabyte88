<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" width="100%" height="100%">
  <defs>
    <!-- Space Cyan & Electric Blue Gradient (Matches Theme Perfectly) -->
    <linearGradient id="cosmicThemeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Star & Ambient Glow Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- ZERO-GRAVITY FLOATING ROOT CONTAINER           -->
  <!-- ============================================== -->
  <g>
    <!-- Ultra-Smooth Pure Sine Float -->
    <animateTransform attributeName="transform" type="translate"
      values="0 2.5; 0 -2.5; 0 2.5"
      dur="3.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- ============================================== -->
    <!-- DENSE TWINKLING STARDUST (BINTIK BINTANG)     -->
    <!-- ============================================== -->
    <g fill="#ffffff">
      <!-- Left Area Stars (Enriched with stardust in place of big star) -->
      <circle cx="20" cy="22" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="14" r="1.0">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="38" cy="27" r="1.2" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="13" r="0.9" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="56" cy="23" r="1.3" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="30" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="75" cy="11" r="0.9">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="85" cy="30" r="1.3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="105" cy="8" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.3s" repeatCount="indefinite"/>
      </circle>

      <!-- Upper & Lower Mid Stars (Near Text) -->
      <circle cx="145" cy="7" r="0.8">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="195" cy="34" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="6" r="1.1" fill="#38bdf8">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="305" cy="34" r="0.9">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="355" cy="7" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" repeatCount="indefinite"/>
      </circle>

      <!-- Right Area Stars (Enriched with stardust in place of big star) -->
      <circle cx="395" cy="31" r="1.2" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="418" cy="10" r="0.9">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="428" cy="27" r="1.3" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="438" cy="14" r="1.0" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="446" cy="24" r="1.3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="454" cy="31" r="0.9" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="465" cy="13" r="1.1" fill="#38bdf8">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="475" cy="28" r="0.9">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="484" cy="18" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Micro Cross Sparkle (✦) -->
    <path d="M 98 22 L 99 20 L 100 22 L 102 22 L 100.5 23 L 101 25 L 99 23.5 L 97 25 L 97.5 23 Z" fill="#00f5d4" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 408 18 L 409 16 L 410 18 L 412 18 L 410.5 19 L 411 21 L 409 19.5 L 407 21 L 407.5 19 Z" fill="#38bdf8" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.0s" repeatCount="indefinite"/>
    </path>

    <!-- ============================================== -->
    <!-- TEXT 1: MALAS NGODING? (SMOOTH CROSSFADE)      -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0; 0"
        keyTimes="0; 0.09; 0.44; 0.52; 0.95; 1"
        dur="6.5s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>

      <!-- Ambient Glow Behind Text (Cyan & Electric Blue) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
        MALAS NGODING?
      </text>
      <!-- Crisp Foreground Text (Cyan & Electric Blue) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="url(#cosmicThemeGrad)">
        MALAS NGODING?
      </text>
    </g>

    <!-- ============================================== -->
    <!-- TEXT 2: BUKA FACEBOOK SOLUSINYA                -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.46; 0.55; 0.91; 0.98; 1"
        dur="6.5s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>

      <!-- Ambient Glow Behind Text (Cyan & Electric Blue) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
        BUKA FACEBOOK SOLUSINYA
      </text>
      <!-- Crisp Foreground Text (Cyan & Electric Blue) -->
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="url(#cosmicThemeGrad)">
        BUKA FACEBOOK SOLUSINYA
      </text>
    </g>
  </g>
</svg>
