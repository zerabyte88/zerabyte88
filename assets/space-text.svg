<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 36" width="100%" height="100%">
  <defs>
    <!-- Arctic Glacial Frost Flowing Wave Gradient -->
    <linearGradient id="cosmicThemeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc">
        <animate attributeName="stop-color"
          values="#f8fafc; #93c5fd; #7dd3fc; #a5f3fc; #f8fafc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="25%" stop-color="#a5f3fc">
        <animate attributeName="stop-color"
          values="#a5f3fc; #f8fafc; #93c5fd; #7dd3fc; #a5f3fc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="50%" stop-color="#7dd3fc">
        <animate attributeName="stop-color"
          values="#7dd3fc; #a5f3fc; #f8fafc; #93c5fd; #7dd3fc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="75%" stop-color="#93c5fd">
        <animate attributeName="stop-color"
          values="#93c5fd; #7dd3fc; #a5f3fc; #f8fafc; #93c5fd"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="100%" stop-color="#f8fafc">
        <animate attributeName="stop-color"
          values="#f8fafc; #93c5fd; #7dd3fc; #a5f3fc; #f8fafc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
    </linearGradient>

    <!-- Diamond Ice Glint Sweep Gradient (GitPulse Mobile Effect) -->
    <linearGradient id="shimmerSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="38%" stop-color="#a5f3fc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="62%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Masks for Shimmer Sweep -->
    <mask id="quoteMask1">
      <text x="250" y="24" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="#ffffff">
        MALAS NGODING?
      </text>
    </mask>

    <mask id="quoteMask2">
      <text x="250" y="24" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="#ffffff">
        BUKA FACEBOOK SOLUSINYA
      </text>
    </mask>

    <!-- Optimized Star & Ambient Glow Filter -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes textFloat {
      0%, 100% {
        transform: translateY(2.5px);
      }
      50% {
        transform: translateY(-2.5px);
      }
    }
    .floating-text {
      animation: textFloat 3.2s ease-in-out infinite;
      will-change: transform;
    }
  </style>

  <!-- ============================================== -->
  <!-- ZERO-GRAVITY FLOATING TEXT CONTAINER (GPU)     -->
  <!-- ============================================== -->
  <g class="floating-text">
    <animateTransform attributeName="transform" type="translate"
      values="0 2.5; 0 -2.5; 0 2.5"
      keyTimes="0; 0.5; 1"
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

    <!-- ============================================== -->
    <!-- TEXT 1: MALAS NGODING? (SEAMLESS ZERO-GAP FADE) -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="1; 1; 0; 0; 1"
        keyTimes="0; 0.422; 0.500; 0.922; 1"
        dur="6.4s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>

      <!-- Ambient Glow Behind Text (Cyan & Electric Blue) -->
      <text x="250" y="24" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
        MALAS NGODING?
      </text>
      <!-- Crisp Foreground Text (Cyan & Electric Blue) -->
      <text x="250" y="24" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="900" letter-spacing="3.5"
        fill="url(#cosmicThemeGrad)">
        MALAS NGODING?
      </text>

      <!-- Shimmer Glint Sweep (GitPulse Mobile Effect) -->
      <g mask="url(#quoteMask1)">
        <rect x="-150" y="0" width="130" height="36" fill="url(#shimmerSweepGrad)">
          <animate attributeName="x" values="-150; 520" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
        </rect>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- TEXT 2: BUKA FACEBOOK SOLUSINYA                -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0"
        keyTimes="0; 0.422; 0.500; 0.922; 1"
        dur="6.4s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>

      <!-- Ambient Glow Behind Text (Cyan & Electric Blue) -->
      <text x="250" y="24" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
        BUKA FACEBOOK SOLUSINYA
      </text>
      <!-- Crisp Foreground Text (Cyan & Electric Blue) -->
      <text x="250" y="24" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="2.8"
        fill="url(#cosmicThemeGrad)">
        BUKA FACEBOOK SOLUSINYA
      </text>

      <!-- Shimmer Glint Sweep (GitPulse Mobile Effect) -->
      <g mask="url(#quoteMask2)">
        <rect x="-150" y="0" width="130" height="36" fill="url(#shimmerSweepGrad)">
          <animate attributeName="x" values="-150; 520" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
