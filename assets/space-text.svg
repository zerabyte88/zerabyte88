<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- Flowing Cosmic Shimmer Gradient -->
    <linearGradient id="cosmicTextGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#00f5d4"/>
      <animate attributeName="x1" values="0%; -100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200%; 100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Star Glow Radial Gradient -->
    <radialGradient id="starGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#00f5d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="starGlowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#7aa2f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <style>
      .float-layer {
        animation: cosmicFloat 4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        will-change: transform;
      }
      @keyframes cosmicFloat {
        0%, 100% { transform: translateY(1.5px); }
        50% { transform: translateY(-2.5px); }
      }

      .text-layer {
        font-family: 'Fira Code', 'Consolas', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .star-spin-left {
        animation: spinSlow 12s linear infinite;
        transform-origin: 0 0;
      }
      .star-spin-right {
        animation: spinSlowReverse 14s linear infinite;
        transform-origin: 0 0;
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinSlowReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
    </style>
  </defs>

  <!-- ============================================== -->
  <!-- ZERO-GRAVITY FLOATING ROOT CONTAINER           -->
  <!-- ============================================== -->
  <g class="float-layer">
    <!-- SMIL Fallback for Zero-Gravity Float (Smooth Spline) -->
    <animateTransform attributeName="transform" type="translate"
      values="0 1.5; 0 -2.5; 0 1.5"
      dur="4s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"/>

    <!-- Left Cosmic Twinkling Star (✦) -->
    <g transform="translate(52, 20)">
      <!-- Radial Halo Glow -->
      <circle cx="0" cy="0" r="12" fill="url(#starGlowCyan)">
        <animate attributeName="r" values="10; 14; 10" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Rotating 4-Point Star Diamond -->
      <g class="star-spin-left">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#00f5d4"/>
        <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
      </g>
    </g>

    <!-- Right Cosmic Twinkling Star (✦) -->
    <g transform="translate(448, 20)">
      <!-- Radial Halo Glow -->
      <circle cx="0" cy="0" r="12" fill="url(#starGlowViolet)">
        <animate attributeName="r" values="10; 14; 10" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Rotating 4-Point Star Diamond -->
      <g class="star-spin-right">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
        <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#c084fc"/>
        <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
      </g>
    </g>

    <!-- Ambient Micro Stardust -->
    <circle cx="82" cy="11" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="418" cy="29" r="1.2" fill="#00f5d4">
      <animate attributeName="opacity" values="0.1; 0.85; 0.1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="30" r="0.9" fill="#7aa2f7">
      <animate attributeName="opacity" values="0.1; 0.8; 0.1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="392" cy="10" r="1" fill="#c084fc">
      <animate attributeName="opacity" values="0.15; 0.85; 0.15" dur="2.3s" repeatCount="indefinite"/>
    </circle>

    <!-- ============================================== -->
    <!-- TEXT 1: MALAS NGODING? (CINEMATIC CROSSFADE)   -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0; 0"
        keyTimes="0; 0.10; 0.44; 0.50; 0.96; 1"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>

      <!-- Vector Ambient Outer Glow (Zero CPU Overhead) -->
      <text x="250" y="20" class="text-layer"
        font-size="20" letter-spacing="3"
        fill="none" stroke="#00f5d4" stroke-width="4.5" stroke-linejoin="round" opacity="0.25">
        MALAS NGODING?
      </text>
      <!-- Vector Bright Inner Neon Halo -->
      <text x="250" y="20" class="text-layer"
        font-size="20" letter-spacing="3"
        fill="none" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round" opacity="0.6">
        MALAS NGODING?
      </text>
      <!-- Crisp Foreground Gradient Text -->
      <text x="250" y="20" class="text-layer"
        font-size="20" letter-spacing="3"
        fill="url(#cosmicTextGrad)">
        MALAS NGODING?
      </text>
    </g>

    <!-- ============================================== -->
    <!-- TEXT 2: BUKA FACEBOOK SOLUSINYA                -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.48; 0.56; 0.92; 0.98; 1"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>

      <!-- Vector Ambient Outer Glow (Zero CPU Overhead) -->
      <text x="250" y="20" class="text-layer"
        font-size="19" letter-spacing="2.5"
        fill="none" stroke="#00f5d4" stroke-width="4.5" stroke-linejoin="round" opacity="0.25">
        BUKA FACEBOOK SOLUSINYA
      </text>
      <!-- Vector Bright Inner Neon Halo -->
      <text x="250" y="20" class="text-layer"
        font-size="19" letter-spacing="2.5"
        fill="none" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round" opacity="0.6">
        BUKA FACEBOOK SOLUSINYA
      </text>
      <!-- Crisp Foreground Gradient Text -->
      <text x="250" y="20" class="text-layer"
        font-size="19" letter-spacing="2.5"
        fill="url(#cosmicTextGrad)">
        BUKA FACEBOOK SOLUSINYA
      </text>
    </g>
  </g>
</svg>
