<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 52" width="100%" height="52">
  <defs>
    <linearGradient id="grad-st" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f5d4"/>
      <stop offset="35%"  stop-color="#38bdf8"/>
      <stop offset="70%"  stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="shimmer-st" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="65%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-st">
      <text x="250" y="36" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="700" letter-spacing="8">STATISTICS</text>
    </clipPath>
    <filter id="glow-st" x="-25%" y="-70%" width="150%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="250" y="36" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="18" font-weight="700" letter-spacing="8"
    fill="url(#grad-st)" filter="url(#glow-st)">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3s" begin="1s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    STATISTICS
  </text>
  <text x="250" y="36" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="18" font-weight="700" letter-spacing="8"
    fill="url(#grad-st)">STATISTICS</text>
  <g clip-path="url(#clip-st)">
    <rect y="14" width="160" height="28" fill="url(#shimmer-st)">
      <animateTransform attributeName="transform" type="translate"
        values="-160,0; 660,0; 660,0"
        keyTimes="0; 0.45; 1"
        dur="5s" begin="1.5s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1; 0 0 1 1"/>
    </rect>
  </g>
  <line x1="158" y1="43" x2="342" y2="43"
    stroke="url(#grad-st)" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 3"/>
</svg>