<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 44" width="100%" height="100%">
  <defs>
    <!-- Fluid Cosmic Gradient matching space-text.svg -->
    <linearGradient id="stGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#38bdf8;#7aa2f7;#00f5d4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#7aa2f7;#00f5d4;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#00f5d4;#38bdf8;#7aa2f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Optimized Star Glow Filter (Lightweight & Smooth) -->
    <filter id="stGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes headingFloat {
      0%, 100% {
        transform: translateY(2.5px);
      }
      50% {
        transform: translateY(-2.5px);
      }
    }
    .floating-layer {
      animation: headingFloat 3.2s ease-in-out infinite;
      will-change: transform;
    }
  </style>

  <!-- Zero-Gravity Gentle Float Animation -->
  <g class="floating-layer">
    <animateTransform attributeName="transform" type="translate"
      values="0 2.5; 0 -2.5; 0 2.5"
      keyTimes="0; 0.5; 1"
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

    <!-- Ambient Twinkling Cosmic Dots -->
    <circle cx="149" cy="24" r="1.8" fill="#00f5d4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="139" cy="24" r="1" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="351" cy="24" r="1.8" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="361" cy="24" r="1" fill="#00f5d4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Glowing Background Aura Layer -->
    <text x="250" y="27" text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="19" font-weight="900" letter-spacing="3.5"
      fill="url(#stGrad)" filter="url(#stGlow)">
      <animate attributeName="opacity"
        values="0.4;0.9;0.4"
        dur="3.2s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      STATISTICS
    </text>

    <!-- Sharp Foreground Text Layer -->
    <text x="250" y="27" text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="19" font-weight="900" letter-spacing="3.5"
      fill="url(#stGrad)">
      STATISTICS
    </text>

    <!-- Sci-Fi HUD Underline Accent -->
    <line x1="165" y1="35" x2="335" y2="35"
      stroke="url(#stGrad)" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
