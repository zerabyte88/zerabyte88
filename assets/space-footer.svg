<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="footerSpaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#0b1028"/>
      <stop offset="100%" stop-color="#060816"/>
    </linearGradient>

    <!-- Top Star Dust Wave Gradients -->
    <linearGradient id="topWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="topWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050714" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0e132c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Laser Line Gradients -->
    <linearGradient id="laserLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="laserRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="20%" stop-color="#7aa2f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor Trail -->
    <linearGradient id="footerMeteorTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#00f5d4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="120" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <!-- Deep Space Background -->
    <rect width="1200" height="120" fill="url(#footerSpaceGrad)"/>

    <!-- Inverted Top Star Dust Wave -->
    <path d="M 0 20 Q 300 40 600 20 T 1200 20 L 1200 0 L 0 0 Z" fill="url(#topWave1)">
      <animate attributeName="d"
        values="M 0 20 Q 300 40 600 20 T 1200 20 L 1200 0 L 0 0 Z;
                M 0 25 Q 300 10 600 25 T 1200 25 L 1200 0 L 0 0 Z;
                M 0 20 Q 300 40 600 20 T 1200 20 L 1200 0 L 0 0 Z"
        dur="6s"
        repeatCount="indefinite"/>
    </path>
    <path d="M 0 8 Q 300 18 600 8 T 1200 8 L 1200 0 L 0 0 Z" fill="url(#topWave2)"/>

    <!-- Twinkling Starfield -->
    <g fill="#ffffff">
      <circle cx="90" cy="55" r="1.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="85" r="1.8" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="45" r="1.2">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="90" r="1.6" fill="#c084fc">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <circle cx="720" cy="85" r="1.5" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="45" r="1.3">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="990" cy="80" r="1.9" fill="#7aa2f7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1110" cy="55" r="1.4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Shooting Star (SMIL animateTransform) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-100 15; 1300 95"
        dur="6s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-65" y2="-12" stroke="url(#footerMeteorTrail)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="url(#coreGlow)"/>
    </g>

    <!-- Centerpiece: Cosmic Satellite & Constellation Beam -->
    <g filter="url(#coreGlow)">
      <!-- Left Laser Line -->
      <line x1="350" y1="65" x2="540" y2="65" stroke="url(#laserLeft)" stroke-width="1.8" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </line>

      <!-- Right Laser Line -->
      <line x1="660" y1="65" x2="850" y2="65" stroke="url(#laserRight)" stroke-width="1.8" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </line>

      <!-- Center Planet / Core Orb with Rotating Ring -->
      <g transform="translate(600, 65)">
        <!-- Rotating Orbital Ring -->
        <ellipse cx="0" cy="0" rx="20" ry="7" fill="none" stroke="#00f5d4" stroke-width="1.6">
          <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="10s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Center Star Orb -->
        <circle cx="0" cy="0" r="8" fill="#7aa2f7"/>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      </g>
    </g>

    <!-- Floating Upward Cosmic Dust Particles -->
    <g>
      <circle cx="570" cy="75" r="1.4" fill="#00f5d4">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.9; 0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="630" cy="75" r="1.4" fill="#c084fc">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.9; 0" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="80" r="1.2" fill="#ffffff">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -25" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.8; 0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="615" cy="80" r="1.2" fill="#7aa2f7">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -25" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.8; 0" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Constellation Text Label -->
    <text x="600" y="98" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#00f5d4" opacity="0.85">
      ✦ COSMOS • EXPLORATION ✦
    </text>
  </g>
</svg>
