<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient (Matched with Header & Tech Stack) -->
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="45%" stop-color="#0c102a"/>
      <stop offset="80%" stop-color="#121838"/>
      <stop offset="100%" stop-color="#070916"/>
    </linearGradient>


    <!-- Realistic Planet Saturn Gradients -->
    <radialGradient id="saturnBodyRealistic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </radialGradient>

    <linearGradient id="saturnRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Realistic Planet Neptune Gradient -->
    <radialGradient id="neptuneBodyRealistic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </radialGradient>

    <!-- Neptune Thin Vertical Ice Ring Gradient -->
    <linearGradient id="neptuneRingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#00f5d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>

    <!-- 3D Spherical Night Shadow (Terminator) -->
    <radialGradient id="sphericalShadow" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Laser Line Gradients -->
    <linearGradient id="laserLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="laserRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="20%" stop-color="#7aa2f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>


    <!-- Center Orb 3D Gradient -->
    <radialGradient id="centerOrbGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f5d4"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="150"/>
    </clipPath>

    <clipPath id="saturnClipFooter">
      <circle cx="0" cy="0" r="19"/>
    </clipPath>

    <clipPath id="neptuneClipFooter">
      <circle cx="0" cy="0" r="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">




    <!-- ============================================== -->
    <!-- 1. DENSE TWINKLING STARFIELD (BINTIK BINTANG)  -->
    <!-- ============================================== -->
    <g fill="#ffffff">
      <!-- Left Sector Stars -->
      <circle cx="50" cy="50" r="1.3">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="85" cy="95" r="1.5" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="35" r="1.0">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="215" cy="40" r="1.4" fill="#7aa2f7">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="230" cy="105" r="1.1" fill="#c084fc">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="65" r="1.3" fill="#ffd166">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.9s" repeatCount="indefinite"/>
      </circle>

      <!-- Mid-Left Stars -->
      <circle cx="340" cy="38" r="1.2">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="410" cy="75" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.1;0.75;0.1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="35" r="1.6" fill="#c084fc">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="510" cy="90" r="1.1">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Mid-Right Stars -->
      <circle cx="690" cy="90" r="1.2" fill="#7aa2f7">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="35" r="1.5" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="75" r="1.0">
        <animate attributeName="opacity" values="0.1;0.75;0.1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="38" r="1.3" fill="#ffd166">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.3s" repeatCount="indefinite"/>
      </circle>

      <!-- Right Sector Stars -->
      <circle cx="920" cy="65" r="1.2" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="970" cy="105" r="1.1">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="990" cy="40" r="1.9" fill="#7aa2f7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="35" r="1.0" fill="#c084fc">
        <animate attributeName="opacity" values="0.1;0.75;0.1" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1110" cy="95" r="1.4" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1150" cy="50" r="1.2">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Sparkling 4-Point Cosmic Star Crosses -->
    <g fill="#00f5d4" filter="url(#starGlow)">
      <path d="M 260 45 L 261 42 L 263 43.5 L 261 45 L 263 46.5 L 261 48 L 260 45 Z" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/>
      </path>
      <path d="M 940 45 L 941 42 L 943 43.5 L 941 45 L 943 46.5 L 941 48 L 940 45 Z" fill="#c084fc" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ============================================== -->
    <!-- 2. REALISTIC CELESTIAL PLANETS                 -->
    <!-- ============================================== -->

    <!-- Planet 1: Realistic Ringed Saturn (Left Side) -->
    <g transform="translate(160, 75)">
      <!-- Ambient Halo Glow -->
      <circle cx="0" cy="0" r="26" fill="#00f5d4" opacity="0.12" filter="url(#starGlow)"/>

      <!-- Back of Planetary Ring -->
      <path d="M -44 -5 A 46 14 0 0 1 44 -5" stroke="url(#saturnRing)" stroke-width="4.2" fill="none" opacity="0.6"/>

      <!-- Saturn Gas Giant Sphere -->
      <circle cx="0" cy="0" r="19" fill="url(#saturnBodyRealistic)"/>

      <!-- Atmospheric Cloud Bands (Clipped to sphere) -->
      <g clip-path="url(#saturnClipFooter)">
        <!-- Band 1: Golden Ammonia Belt -->
        <rect x="-19" y="-8" width="38" height="4" fill="#fde68a" opacity="0.35"/>
        <!-- Band 2: Cyan Jetstream -->
        <rect x="-19" y="-2" width="38" height="3" fill="#00f5d4" opacity="0.25"/>
        <!-- Band 3: Deep Azure Belt -->
        <rect x="-19" y="2" width="38" height="5" fill="#1e40af" opacity="0.4"/>
        <!-- Band 4: Polar Vortex -->
        <ellipse cx="0" cy="-17" rx="8" ry="3" fill="#1e3a8a" opacity="0.6"/>
        <!-- 3D Spherical Night Shadow -->
        <circle cx="0" cy="0" r="19" fill="url(#sphericalShadow)"/>
      </g>

      <!-- Atmosphere Edge Highlight -->
      <path d="M -13.5 -13.5 A 19 19 0 0 1 13.5 13.5 A 17 17 0 0 0 -13.5 -13.5 Z" fill="#7aa2f7" opacity="0.5"/>

      <!-- Front of Planetary Ring with Cassini Division -->
      <path d="M -46 0 A 48 15 0 0 0 48 0" stroke="url(#saturnRing)" stroke-width="4.8" fill="none">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- Cassini Gap (Dark Division) -->
      <path d="M -42 1 A 44 14 0 0 0 42 1" stroke="#050714" stroke-width="0.9" fill="none" opacity="0.9"/>
    </g>

    <!-- Planet 2: Deep Azure Ice Giant Neptune with Vertical Ring (Right Side) -->
    <g transform="translate(1040, 75)">
      <!-- Deep Blue Corona Halo -->
      <circle cx="0" cy="0" r="26" fill="#0284c7" opacity="0.18" filter="url(#starGlow)"/>

      <!-- Back of Vertical Tilted Thin Ice Ring -->
      <g transform="rotate(-18)">
        <path d="M 0 -36 A 8 36 0 0 1 0 36" stroke="url(#neptuneRingGrad)" stroke-width="2.2" fill="none" opacity="0.65"/>
      </g>

      <!-- Neptune Ice Giant Sphere -->
      <circle cx="0" cy="0" r="18" fill="url(#neptuneBodyRealistic)"/>

      <!-- Atmospheric Bands & Great Dark Spot (Clipped to sphere) -->
      <g clip-path="url(#neptuneClipFooter)">
        <!-- High-Altitude Methane Cloud Bands -->
        <rect x="-18" y="-12" width="36" height="3" fill="#bae6fd" opacity="0.4"/>
        <rect x="-18" y="-4" width="36" height="4" fill="#0369a1" opacity="0.5"/>
        <rect x="-18" y="5" width="36" height="3" fill="#38bdf8" opacity="0.45"/>
        <rect x="-18" y="11" width="36" height="4" fill="#0c4a6e" opacity="0.55"/>

        <!-- Great Dark Spot (Badai Raksasa Neptunus) -->
        <ellipse cx="4" cy="1" rx="5" ry="3" fill="#082f49" opacity="0.9"/>
        <!-- White Companion Cirrus Clouds (Scooter Clouds) -->
        <path d="M 0 -1 Q 5 -3 9 0 Q 5 2 0 -1 Z" fill="#ffffff" opacity="0.75"/>

        <!-- 3D Spherical Night Shadow -->
        <circle cx="0" cy="0" r="18" fill="url(#sphericalShadow)"/>
      </g>

      <!-- Atmosphere Cyan Edge Highlight -->
      <path d="M -13 -13 A 18 18 0 0 1 13 13 A 16 16 0 0 0 -13 -13 Z" fill="#38bdf8" opacity="0.65"/>

      <!-- Front of Vertical Tilted Thin Ice Ring -->
      <g transform="rotate(-18)">
        <path d="M 0 36 A 8 36 0 0 1 0 -36" stroke="url(#neptuneRingGrad)" stroke-width="2.2" fill="none">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Sparkling Ice Crystals around Ring -->
      <circle cx="-6" cy="-22" r="1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="6" cy="22" r="1" fill="#7dd3fc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>


    <!-- ============================================== -->
    <!-- 4. CENTERPIECE: PULSAR SINGULARITY & LASERS    -->
    <!-- ============================================== -->
    <g filter="url(#coreGlow)">
      <!-- Left Laser Line -->
      <line x1="330" y1="48" x2="545" y2="48" stroke="url(#laserLeft)" stroke-width="1.8" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </line>

      <!-- Right Laser Line -->
      <line x1="655" y1="48" x2="870" y2="48" stroke="url(#laserRight)" stroke-width="1.8" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </line>

      <!-- Center Pulsar / Cosmic Core Singularity with Dual Quantum Rings -->
      <g transform="translate(600, 48)">
        <!-- Outer Quantum Ring (Clockwise, Tilted -25 deg) -->
        <g transform="rotate(-25)">
          <ellipse cx="0" cy="0" rx="23" ry="8" fill="none" stroke="#00f5d4" stroke-width="1.3">
            <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="8s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <!-- Inner Counter-Rotating Quantum Ring (Counter-Clockwise, Tilted 35 deg) -->
        <g transform="rotate(35)">
          <ellipse cx="0" cy="0" rx="20" ry="7" fill="none" stroke="#c084fc" stroke-width="1.2">
            <animateTransform attributeName="transform" type="rotate" values="360; 0" dur="5.5s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <!-- Center Singularity Core -->
        <circle cx="0" cy="0" r="9" fill="url(#centerOrbGrad)"/>
        <!-- Radiant Singularity Pulse -->
        <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#coreGlow)">
          <animate attributeName="r" values="3.2;5;3.2" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Floating Upward Cosmic Dust Particles -->
    <g>
      <circle cx="570" cy="58" r="1.4" fill="#00f5d4">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -25" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.9; 0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="630" cy="58" r="1.4" fill="#c084fc">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -25" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.9; 0" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="62" r="1.2" fill="#ffffff">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.8; 0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="615" cy="62" r="1.2" fill="#7aa2f7">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.8; 0" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============================================== -->
    <!-- 5. SPACE TRAVEL & COSMIC QUOTE                 -->
    <!-- ============================================== -->
    <g>
      <!-- Soft Cosmic Glow Layer -->
      <text x="600" y="114" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="0.8" fill="#00f5d4" opacity="0.4" filter="url(#coreGlow)">
        ✦ “Across the sea of space, the stars are other suns.” - Carl Sagan ✦
      </text>
      <!-- Crisp Foreground Text -->
      <text x="600" y="114" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="0.8" fill="#00f5d4" opacity="0.95">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3.5s" repeatCount="indefinite"/>
        ✦ “Across the sea of space, the stars are other suns.” - Carl Sagan ✦
      </text>
    </g>


  </g>
</svg>
