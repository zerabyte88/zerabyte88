<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradients -->
    <linearGradient id="spaceCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1330"/>
      <stop offset="100%" stop-color="#070a1a"/>
    </linearGradient>

    <!-- Constellation Line Gradients -->
    <linearGradient id="lineCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00bbf9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="lineVioletCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starPulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. BACKGROUND TWINKLING STARFIELD         -->
  <!-- ========================================== -->
  <g fill="#ffffff">
    <circle cx="45" cy="40" r="1.2">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="25" r="1.5" fill="#00f5d4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="35" r="1.1">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="20" r="1.4" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="45" r="1.2">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="190" r="1.3" fill="#7aa2f7">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="140" r="1.5">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="190" r="1.2" fill="#00f5d4">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="240" r="1.4">
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="320" r="1.1" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="330" r="1.4">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="320" r="1.3" fill="#00f5d4">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ========================================== -->
  <!-- 2. CONSTELLATION CATEGORY LABELS           -->
  <!-- ========================================== -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">
    <!-- Frontend -->
    <text x="310" y="24" fill="#00f5d4" text-anchor="middle" opacity="0.8">
      ✦ FRONTEND ✦
    </text>
    <!-- Mobile -->
    <text x="730" y="24" fill="#00bbf9" text-anchor="middle" opacity="0.8">
      ✦ MOBILE ✦
    </text>
    <!-- Backend -->
    <text x="330" y="138" fill="#7aa2f7" text-anchor="middle" opacity="0.8">
      ✦ BACKEND ✦
    </text>
    <!-- Tools -->
    <text x="422" y="254" fill="#c084fc" text-anchor="middle" opacity="0.8">
      ✦ TOOLS ✦
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 3. GLOWING CONSTELLATION CONNECTING LINES  -->
  <!-- ========================================== -->
  <g stroke="url(#lineCyanBlue)" stroke-width="1.2" stroke-dasharray="3,3">
    <!-- Frontend Chain -->
    <line x1="135" y1="60" x2="310" y2="50"/>
    <line x1="310" y1="50" x2="500" y2="65"/>

    <!-- Frontend to Mobile Link -->
    <line x1="500" y1="65" x2="680" y2="55"/>
    <line x1="680" y1="55" x2="780" y2="130"/>

    <!-- Vertical Bridges: Frontend to Backend -->
    <line x1="135" y1="60" x2="145" y2="165"/>
    <line x1="310" y1="50" x2="330" y2="175"/>
    <line x1="500" y1="65" x2="515" y2="185"/>

    <!-- Backend Chain -->
    <line x1="145" y1="165" x2="330" y2="175"/>
    <line x1="330" y1="175" x2="515" y2="185"/>

    <!-- Mobile to Backend Crosslink -->
    <line x1="780" y1="130" x2="515" y2="185" stroke="url(#lineVioletCyan)"/>

    <!-- Backend to Tools Bridges -->
    <line x1="330" y1="175" x2="320" y2="285"/>
    <line x1="515" y1="185" x2="525" y2="295"/>

    <!-- Tools Chain -->
    <line x1="320" y1="285" x2="525" y2="295"/>
  </g>

  <!-- Animated Pulsing Solid Laser Overlay -->
  <g stroke="#00f5d4" stroke-width="0.8" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.65;0.2" dur="3.5s" repeatCount="indefinite"/>
    <line x1="135" y1="60" x2="310" y2="50"/>
    <line x1="310" y1="50" x2="500" y2="65"/>
    <line x1="500" y1="65" x2="680" y2="55"/>
    <line x1="680" y1="55" x2="780" y2="130"/>
    <line x1="145" y1="165" x2="330" y2="175"/>
    <line x1="330" y1="175" x2="515" y2="185"/>
    <line x1="320" y1="285" x2="525" y2="295"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. ACTIVE CONSTELLATION ENERGY PULSES       -->
  <!-- ========================================== -->
  <!-- Pulse 1: Frontend Orbit (HTML5 -> CSS3 -> JS) -->
  <circle r="2.2" fill="#ffffff" filter="url(#starPulseGlow)">
    <animate attributeName="cx" values="135;310;500;310;135" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;50;65;50;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.9;1;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse 2: Backend Line (PHP -> MySQL -> C++) -->
  <circle r="2.2" fill="#00f5d4" filter="url(#starPulseGlow)">
    <animate attributeName="cx" values="145;330;515;330;145" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="165;175;185;175;165" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.9;1;0.4" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse 3: Mobile to Tools Loop (Flutter -> Dart -> C++ -> VS Code -> Git) -->
  <circle r="2.2" fill="#c084fc" filter="url(#starPulseGlow)">
    <animate attributeName="cx" values="680;780;515;525;320;330" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;130;185;295;285;175" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.9;1;0.8;0.3" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ========================================== -->
  <!-- 5. TECH NODES (FLOATING CONSTELLATION KEYS)-->
  <!-- ========================================== -->

  <!-- NODE 1: HTML5 (cx: 135, cy: 60) -->
  <g transform="translate(135, 60)">
    <animateTransform attributeName="transform" type="translate"
      values="135 60; 135 57; 135 60" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#e34f26" stroke-width="0.8" opacity="0.35" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-56" y="-16" width="112" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#e34f26" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- HTML5 Icon -->
    <circle cx="-38" cy="0" r="9" fill="#e34f26"/>
    <text x="-38" y="3.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
    <!-- Label -->
    <text x="6" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">HTML5</text>
  </g>

  <!-- NODE 2: CSS3 (cx: 310, cy: 50) -->
  <g transform="translate(310, 50)">
    <animateTransform attributeName="transform" type="translate"
      values="310 50; 310 53; 310 50" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1572b6" stroke-width="0.8" opacity="0.35" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-54" y="-16" width="108" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#1572b6" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- CSS3 Icon -->
    <circle cx="-36" cy="0" r="9" fill="#1572b6"/>
    <text x="-36" y="3.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <!-- Label -->
    <text x="6" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">CSS3</text>
  </g>

  <!-- NODE 3: JAVASCRIPT (cx: 500, cy: 65) -->
  <g transform="translate(500, 65)">
    <animateTransform attributeName="transform" type="translate"
      values="500 65; 500 62; 500 65" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#f7df1e" stroke-width="0.8" opacity="0.35" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-66" y="-16" width="132" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#f7df1e" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- JS Icon -->
    <rect x="-53" y="-8.5" width="17" height="17" rx="3" fill="#f7df1e"/>
    <text x="-44.5" y="4.5" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#000000" text-anchor="middle">JS</text>
    <!-- Label -->
    <text x="11" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.8" text-anchor="middle">JAVASCRIPT</text>
  </g>

  <!-- NODE 4: FLUTTER (cx: 680, cy: 55) -->
  <g transform="translate(680, 55)">
    <animateTransform attributeName="transform" type="translate"
      values="680 55; 680 58; 680 55" dur="4.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#02569b" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-58" y="-16" width="116" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#02569b" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- Flutter Icon (Wing) -->
    <circle cx="-40" cy="0" r="9" fill="#02569b"/>
    <path d="M -43 -4 L -39 0 L -43 4 M -39 -4 L -35 0 L -39 4" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Label -->
    <text x="6" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">FLUTTER</text>
  </g>

  <!-- NODE 5: DART (cx: 780, cy: 130) -->
  <g transform="translate(780, 130)">
    <animateTransform attributeName="transform" type="translate"
      values="780 130; 780 127; 780 130" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0175c2" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-52" y="-16" width="104" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#0175c2" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- Dart Icon -->
    <circle cx="-34" cy="0" r="9" fill="#0175c2"/>
    <polygon points="-36,-4 -30,0 -36,4 -34,0" fill="#ffffff"/>
    <!-- Label -->
    <text x="6" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">DART</text>
  </g>

  <!-- NODE 6: PHP (cx: 145, cy: 165) -->
  <g transform="translate(145, 165)">
    <animateTransform attributeName="transform" type="translate"
      values="145 165; 145 168; 145 165" dur="4.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#777bb4" stroke-width="0.8" opacity="0.35" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-50" y="-16" width="100" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#777bb4" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- PHP Icon -->
    <ellipse cx="-33" cy="0" rx="9" ry="7" fill="#777bb4"/>
    <text x="-33" y="2.5" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">PHP</text>
    <!-- Label -->
    <text x="7" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">PHP</text>
  </g>

  <!-- NODE 7: MYSQL (cx: 330, cy: 175) -->
  <g transform="translate(330, 175)">
    <animateTransform attributeName="transform" type="translate"
      values="330 175; 330 172; 330 175" dur="3.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#4479a1" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-56" y="-16" width="112" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#4479a1" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- MySQL Icon -->
    <circle cx="-38" cy="0" r="9" fill="#4479a1"/>
    <text x="-38" y="3" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">SQL</text>
    <!-- Label -->
    <text x="7" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">MYSQL</text>
  </g>

  <!-- NODE 8: C++ (cx: 515, cy: 185) -->
  <g transform="translate(515, 185)">
    <animateTransform attributeName="transform" type="translate"
      values="515 185; 515 188; 515 185" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00599c" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-50" y="-16" width="100" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#00599c" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- C++ Icon -->
    <circle cx="-33" cy="0" r="9" fill="#00599c"/>
    <text x="-33" y="3.5" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    <!-- Label -->
    <text x="6" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">C++</text>
  </g>

  <!-- NODE 9: GIT (cx: 320, cy: 285) -->
  <g transform="translate(320, 285)">
    <animateTransform attributeName="transform" type="translate"
      values="320 285; 320 282; 320 285" dur="3.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#f05032" stroke-width="0.8" opacity="0.35" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-50" y="-16" width="100" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#f05032" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- Git Icon -->
    <circle cx="-33" cy="0" r="9" fill="#f05032"/>
    <circle cx="-35" cy="-3" r="2" fill="#ffffff"/>
    <circle cx="-31" cy="3" r="2" fill="#ffffff"/>
    <line x1="-35" y1="-3" x2="-31" y2="3" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Label -->
    <text x="7" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">GIT</text>
  </g>

  <!-- NODE 10: VS CODE (cx: 525, cy: 295) -->
  <g transform="translate(525, 295)">
    <animateTransform attributeName="transform" type="translate"
      values="525 295; 525 298; 525 295" dur="4.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#0078d4" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>
    <!-- Node Card -->
    <rect x="-60" y="-16" width="120" height="32" rx="7" fill="url(#spaceCardBg)" stroke="#0078d4" stroke-width="1.3" filter="url(#neonBlur)"/>
    <!-- VS Code Icon -->
    <circle cx="-42" cy="0" r="9" fill="#0078d4"/>
    <polygon points="-44,-4 -38,0 -44,4" fill="#ffffff"/>
    <!-- Label -->
    <text x="8" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">VS CODE</text>
  </g>

  <!-- Star Clasp Accents at Key Junctions -->
  <g fill="#00f5d4">
    <!-- Star 1 -->
    <path d="M 500 65 L 501.5 63.5 L 503 65 L 501.5 66.5 Z"/>
    <!-- Star 2 -->
    <path d="M 330 175 L 331.5 173.5 L 333 175 L 331.5 176.5 Z"/>
    <!-- Star 3 -->
    <path d="M 515 185 L 516.5 183.5 L 518 185 L 516.5 186.5 Z"/>
  </g>
</svg>
