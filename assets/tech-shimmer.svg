<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%" height="100%">
  <defs>
    <!-- 90° Pure Vertical Shimmer Gradient (Left to Right) -->
    <linearGradient id="verticalShimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="38%" stop-color="#00f5d4" stop-opacity="0.12"/>
      <stop offset="47%" stop-color="#00f5d4" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="53%" stop-color="#00bbf9" stop-opacity="0.75"/>
      <stop offset="62%" stop-color="#00bbf9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor 1 Trail: Cyan / Electric Blue -->
    <linearGradient id="meteorCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor 2 Trail: Pink / Nebula Violet -->
    <linearGradient id="meteorPink" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f72585" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor 3 Trail: Sky Blue / Cobalt -->
    <linearGradient id="meteorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor 4 Trail: Violet / Cyan -->
    <linearGradient id="meteorViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter for Shooting Stars -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mask Covering all Badge Shapes -->
    <mask id="badgeMask">
      <!-- Row 1: Frontend -->
      <rect x="223" y="34" width="100" height="28" rx="4" fill="#ffffff"/>
      <rect x="335" y="34" width="95" height="28" rx="4" fill="#ffffff"/>
      <rect x="442" y="34" width="135" height="28" rx="4" fill="#ffffff"/>

      <!-- Row 2: Backend -->
      <rect x="250" y="108" width="85" height="28" rx="4" fill="#ffffff"/>
      <rect x="347" y="108" width="85" height="28" rx="4" fill="#ffffff"/>
      <rect x="444" y="108" width="106" height="28" rx="4" fill="#ffffff"/>

      <!-- Row 3: Mobile -->
      <rect x="289" y="182" width="115" height="28" rx="4" fill="#ffffff"/>
      <rect x="416" y="182" width="95" height="28" rx="4" fill="#ffffff"/>

      <!-- Row 4: Tools -->
      <rect x="294" y="256" width="85" height="28" rx="4" fill="#ffffff"/>
      <rect x="391" y="256" width="115" height="28" rx="4" fill="#ffffff"/>
    </mask>

    <clipPath id="canvasClip">
      <rect x="0" y="0" width="800" height="310"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">

    <!-- ============================================== -->
    <!-- 1. TWINKLING BACKGROUND STARS                  -->
    <!-- ============================================== -->
    <g fill="#ffffff">
      <circle cx="90" cy="45" r="1.3">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="710" cy="35" r="1.5" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="190" r="1.2" fill="#7aa2f7">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="690" cy="180" r="1.4" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="275" r="1.1">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="285" r="1.3" fill="#c084fc">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============================================== -->
    <!-- 2. MULTIPLE SHOOTING STARS (BINTANG JATUH)     -->
    <!-- ============================================== -->

    <!-- Meteor 1 (Cyan/White: Streaks Left -> Right, Top to Mid) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-120 15; 920 195"
        dur="4.6s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-75" y2="-15" stroke="url(#meteorCyan)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 2 (Pink/Violet: Streaks Right -> Left, Top to Mid) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="920 5; -140 185"
        dur="5.8s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="68" y2="-14" stroke="url(#meteorPink)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 3 (Sky Blue: Streaks Left -> Right, Mid to Bottom) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-100 115; 940 295"
        dur="6.4s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-70" y2="-14" stroke="url(#meteorBlue)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.4" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 4 (Violet/Cyan: Streaks Right -> Left, Mid to Bottom) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="900 135; -120 295"
        dur="7.2s"
        repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="65" y2="-13" stroke="url(#meteorViolet)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- ============================================== -->
    <!-- 3. CATEGORY HEADINGS                           -->
    <!-- ============================================== -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#94a3b8">
      <!-- Frontend -->
      <text x="400" y="22"><tspan fill="#00f5d4">•</tspan> FRONTEND</text>
      <!-- Backend -->
      <text x="400" y="96"><tspan fill="#00f5d4">•</tspan> BACKEND</text>
      <!-- Mobile -->
      <text x="400" y="170"><tspan fill="#00f5d4">•</tspan> MOBILE</text>
      <!-- Tools -->
      <text x="400" y="244"><tspan fill="#00f5d4">•</tspan> TOOLS</text>
    </g>

    <!-- ============================================== -->
    <!-- 4. TECH STACK BADGES                           -->
    <!-- ============================================== -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1">

      <!-- ============ ROW 1: FRONTEND ============ -->
      <!-- HTML5 (x: 223, width: 100) -->
      <g transform="translate(223, 34)">
        <rect width="100" height="28" rx="4" fill="#e34f26"/>
        <rect width="28" height="28" rx="4" fill="#b93815"/>
        <rect x="24" width="4" height="28" fill="#e34f26"/>
        <text x="14" y="18" fill="#ffffff" font-size="12" text-anchor="middle">5</text>
        <text x="62" y="18" fill="#ffffff" text-anchor="middle">HTML5</text>
      </g>

      <!-- CSS3 (x: 335, width: 95) -->
      <g transform="translate(335, 34)">
        <rect width="95" height="28" rx="4" fill="#1572b6"/>
        <rect width="28" height="28" rx="4" fill="#0d5284"/>
        <rect x="24" width="4" height="28" fill="#1572b6"/>
        <text x="14" y="18" fill="#ffffff" font-size="12" text-anchor="middle">#</text>
        <text x="60" y="18" fill="#ffffff" text-anchor="middle">CSS3</text>
      </g>

      <!-- JAVASCRIPT (x: 442, width: 135) -->
      <g transform="translate(442, 34)">
        <rect width="135" height="28" rx="4" fill="#f7df1e"/>
        <rect width="28" height="28" rx="4" fill="#d4be14"/>
        <rect x="24" width="4" height="28" fill="#f7df1e"/>
        <text x="14" y="18" fill="#000000" font-size="11" text-anchor="middle">JS</text>
        <text x="80" y="18" fill="#000000" text-anchor="middle">JAVASCRIPT</text>
      </g>

      <!-- ============ ROW 2: BACKEND ============ -->
      <!-- PHP (x: 250, width: 85) -->
      <g transform="translate(250, 108)">
        <rect width="85" height="28" rx="4" fill="#777bb4"/>
        <rect width="26" height="28" rx="4" fill="#585c8f"/>
        <rect x="22" width="4" height="28" fill="#777bb4"/>
        <text x="13" y="17.5" fill="#ffffff" font-size="9" text-anchor="middle">PHP</text>
        <text x="54" y="18" fill="#ffffff" text-anchor="middle">PHP</text>
      </g>

      <!-- C++ (x: 347, width: 85) -->
      <g transform="translate(347, 108)">
        <rect width="85" height="28" rx="4" fill="#00599c"/>
        <rect width="26" height="28" rx="4" fill="#003e6d"/>
        <rect x="22" width="4" height="28" fill="#00599c"/>
        <text x="13" y="18" fill="#ffffff" font-size="11" text-anchor="middle">C</text>
        <text x="54" y="18" fill="#ffffff" text-anchor="middle">C++</text>
      </g>

      <!-- MYSQL (x: 444, width: 106) -->
      <g transform="translate(444, 108)">
        <rect width="106" height="28" rx="4" fill="#4479a1"/>
        <rect width="28" height="28" rx="4" fill="#305a7b"/>
        <rect x="24" width="4" height="28" fill="#4479a1"/>
        <text x="14" y="17.5" fill="#ffffff" font-size="8.5" text-anchor="middle">SQL</text>
        <text x="65" y="18" fill="#ffffff" text-anchor="middle">MYSQL</text>
      </g>

      <!-- ============ ROW 3: MOBILE ============ -->
      <!-- FLUTTER (x: 289, width: 115) -->
      <g transform="translate(289, 182)">
        <rect width="115" height="28" rx="4" fill="#02569b"/>
        <rect width="28" height="28" rx="4" fill="#013b6b"/>
        <rect x="24" width="4" height="28" fill="#02569b"/>
        <path d="M 10 9 L 14 14 L 10 19 M 14 9 L 18 14 L 14 19" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <text x="70" y="18" fill="#ffffff" text-anchor="middle">FLUTTER</text>
      </g>

      <!-- DART (x: 416, width: 95) -->
      <g transform="translate(416, 182)">
        <rect width="95" height="28" rx="4" fill="#0175c2"/>
        <rect width="28" height="28" rx="4" fill="#015288"/>
        <rect x="24" width="4" height="28" fill="#0175c2"/>
        <polygon points="10,9 18,14 10,19 12,14" fill="#ffffff"/>
        <text x="60" y="18" fill="#ffffff" text-anchor="middle">DART</text>
      </g>

      <!-- ============ ROW 4: TOOLS ============ -->
      <!-- GIT (x: 294, width: 85) -->
      <g transform="translate(294, 256)">
        <rect width="85" height="28" rx="4" fill="#f05032"/>
        <rect width="26" height="28" rx="4" fill="#bf361c"/>
        <rect x="22" width="4" height="28" fill="#f05032"/>
        <circle cx="11" cy="11" r="2" fill="#ffffff"/>
        <circle cx="15" cy="17" r="2" fill="#ffffff"/>
        <line x1="11" y1="11" x2="15" y2="17" stroke="#ffffff" stroke-width="1.2"/>
        <text x="54" y="18" fill="#ffffff" text-anchor="middle">GIT</text>
      </g>

      <!-- VS CODE (x: 391, width: 115) -->
      <g transform="translate(391, 256)">
        <rect width="115" height="28" rx="4" fill="#0078d4"/>
        <rect width="28" height="28" rx="4" fill="#005394"/>
        <rect x="24" width="4" height="28" fill="#0078d4"/>
        <polygon points="10,9 18,14 10,19" fill="#ffffff"/>
        <text x="70" y="18" fill="#ffffff" text-anchor="middle">VS CODE</text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- 5. 90° VERTICAL SHIMMER GLINT (LEFT TO RIGHT)  -->
    <!-- ============================================== -->
    <g mask="url(#badgeMask)">
      <rect x="-300" y="0" width="300" height="310" fill="url(#verticalShimmerGrad)">
        <animate attributeName="x"
          values="-300; 850"
          dur="3.2s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>

  </g>
</svg>
