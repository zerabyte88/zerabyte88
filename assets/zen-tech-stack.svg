<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 245" width="100%" height="100%">
  <defs>
    <!-- Zen Navy Canvas -->
    <linearGradient id="zenCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1022"/>
      <stop offset="50%" stop-color="#141830"/>
      <stop offset="100%" stop-color="#111428"/>
    </linearGradient>

    <!-- Soft Corner Radial Glows -->
    <radialGradient id="cornerGlowTL" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d1022" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlowBR" cx="100%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#111428" stop-opacity="0"/>
    </radialGradient>

    <!-- Pill Fill Gradient -->
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2240"/>
      <stop offset="100%" stop-color="#12152b"/>
    </linearGradient>

    <!-- Horizontal Shimmer Sweep -->
    <linearGradient id="sakuraShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f9a8d4" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#fff1f2" stop-opacity="0.52"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask Covering All 11 Pills -->
    <mask id="pillMask">
      <!-- Top-Left: MOBILE -->
      <rect x="62" y="60" width="96" height="34" rx="8" fill="#ffffff"/>
      <rect x="170" y="60" width="78" height="34" rx="8" fill="#ffffff"/>
      <rect x="260" y="60" width="90" height="34" rx="8" fill="#ffffff"/>
      <!-- Top-Right: FRONTEND & WEB -->
      <rect x="437" y="60" width="92" height="34" rx="8" fill="#ffffff"/>
      <rect x="539" y="60" width="98" height="34" rx="8" fill="#ffffff"/>
      <rect x="647" y="60" width="104" height="34" rx="8" fill="#ffffff"/>
      <!-- Bottom-Left: WEB SCRIPTING -->
      <rect x="81" y="170" width="118" height="34" rx="8" fill="#ffffff"/>
      <rect x="213" y="170" width="118" height="34" rx="8" fill="#ffffff"/>
      <!-- Bottom-Right: TOOLS -->
      <rect x="426" y="170" width="70" height="34" rx="8" fill="#ffffff"/>
      <rect x="506" y="170" width="100" height="34" rx="8" fill="#ffffff"/>
      <rect x="616" y="170" width="146" height="34" rx="8" fill="#ffffff"/>
    </mask>

    <clipPath id="techClip">
      <rect x="0" y="0" width="800" height="245" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#techClip)">
    <!-- Canvas Background -->
    <rect x="0" y="0" width="800" height="245" fill="url(#zenCanvas)"/>
    <rect x="0" y="0" width="800" height="245" fill="url(#cornerGlowTL)"/>
    <rect x="0" y="0" width="800" height="245" fill="url(#cornerGlowBR)"/>

    <!-- 2 Subtle Drifting Sakura Petals at Margins -->
    <path d="M 0 -4 C 3 -4 4.5 -1 3 3 C 1.2 4.5 -1.2 4.5 -3 3 C -4.5 -1 -3 -4 0 -4 Z" fill="#f9a8d4" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="12,-10; 18,125; 10,255" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.45;0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 -3.5 C 2.8 -3.5 4 -0.8 2.8 2.8 C 1 4 -1 4 -2.8 2.8 C -4 -0.8 -2.8 -3.5 0 -3.5 Z" fill="#fbcfe8" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="788,-10; 782,120; 790,255" dur="14s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.45;0" dur="14s" begin="-4s" repeatCount="indefinite"/>
    </path>

    <!-- 4 Frosted Sub-Cards (2x2 Grid) -->
    <g fill="#171c36" fill-opacity="0.75" stroke="#f9a8d4" stroke-opacity="0.18" stroke-width="1">
      <rect x="24" y="20" width="364" height="96" rx="10"/>
      <rect x="412" y="20" width="364" height="96" rx="10"/>
      <rect x="24" y="130" width="364" height="96" rx="10"/>
      <rect x="412" y="130" width="364" height="96" rx="10"/>
    </g>

    <!-- Category Headings -->
    <g font-family="Verdana, Geneva, 'DejaVu Sans', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" text-anchor="middle" fill="#a5b4fc">
      <text x="206" y="44"><tspan fill="#f9a8d4">✦</tspan> MOBILE</text>
      <text x="594" y="44"><tspan fill="#f9a8d4">✦</tspan> FRONTEND &amp; WEB</text>
      <text x="206" y="154"><tspan fill="#f9a8d4">✦</tspan> WEB SCRIPTING</text>
      <text x="594" y="154"><tspan fill="#f9a8d4">✦</tspan> TOOLS</text>
    </g>

    <!-- Tech Pills -->
    <g font-family="Verdana, Geneva, 'DejaVu Sans', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#fce7f3">
      <!-- ============ TOP-LEFT: MOBILE ============ -->
      <!-- Flutter -->
      <g transform="translate(62, 60)">
        <rect width="96" height="34" rx="8" fill="url(#pillFill)" stroke="#f9a8d4" stroke-opacity="0.26" stroke-width="1"/>
        <svg x="10" y="9" width="16" height="16" viewBox="0 0 24 24">
          <path fill="#fff1f2" d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.357zm.014 11.072L7.857 17.53l6.47 6.47H21.7l-6.46-6.468 6.46-6.46h-7.37z"/>
        </svg>
        <text x="34" y="21">Flutter</text>
      </g>

      <!-- Dart -->
      <g transform="translate(170, 60)">
        <rect width="78" height="34" rx="8" fill="url(#pillFill)" stroke="#f9a8d4" stroke-opacity="0.26" stroke-width="1"/>
        <svg x="10" y="9" width="16" height="16" viewBox="0 0 24 24">
          <path fill="#fff1f2" d="M4.105 4.105S9.158 1.58 11.684.316a3.079 3.079 0 0 1 1.481-.315c.766.047 1.677.788 1.677.788L24 9.948v9.789h-4.263V24H9.789l-9-9C.303 14.5 0 13.795 0 13.105c0-.319.18-.818.316-1.105l3.789-7.895zm.679.679v11.787c.002.543.021 1.024.498 1.508L10.204 23h8.533v-4.263L4.784 4.784zm12.055-.678c-.899-.896-1.809-1.78-2.74-2.643-.302-.267-.567-.468-1.07-.462-.37.014-.87.195-.87.195L6.341 4.105l10.498.001z"/>
        </svg>
        <text x="34" y="21">Dart</text>
      </g>

      <!-- Kotlin -->
      <g transform="translate(260, 60)">
        <rect width="90" height="34" rx="8" fill="url(#pillFill)" stroke="#f9a8d4" stroke-opacity="0.26" stroke-width="1"/>
        <svg x="10" y="9" width="16" height="16" viewBox="0 0 24 24">
          <path fill="#fff1f2" d="M24 24H0V0h24L12 12Z"/>
        </svg>
        <text x="34" y="21">Kotlin</text>
      </g>

      <!-- ============ TOP-RIGHT: FRONTEND & WEB ============ -->
      <!-- Vue.js -->
      <g transform="translate(437, 60)">
        <rect width="92" height="34" rx="8" fill="url(#pillFill)" stroke="#f9a8d4" stroke-opacity="0.26" stroke-width="1"/>
        <svg x="10" y="9" width="16" height="16" viewBox="0 0 24 24">
