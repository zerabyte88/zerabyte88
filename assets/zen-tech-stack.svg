        </svg>
        <text x="33" y="21">Android Studio</text>
      </g>
    </g>

    <!-- Masked Horizontal Shimmer Sweep Across Pills -->
    <g mask="url(#pillMask)">
      <rect x="-240" y="0" width="220" height="245" fill="url(#sakuraShimmer)">
        <animate attributeName="x" values="-240; 860" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>

    <!-- Subtle Sakura Border -->
    <rect x="0.75" y="0.75" width="798.5" height="243.5" rx="13.5" fill="none" stroke="#f9a8d4" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
