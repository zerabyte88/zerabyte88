        </svg>
        <text x="34" y="21">JavaScript</text>
      </g>

      <!-- ============ BOTTOM-RIGHT: TOOLS ============ -->
      <!-- Git -->
      <g transform="translate(426, 170)">
        <rect width="70" height="34" rx="8" fill="url(#pillFill)" stroke="#f9a8d4" stroke-opacity="0.26" stroke-width="1"/>
        <svg x="10" y="9" width="16" height="16" viewBox="0 0 24 24">
          <path fill="#fff1f2" d="M13.09 23.549a1.54 1.54 0 0 1-2.18 0L.451 13.089a1.54 1.54 0 0 1 0-2.179l7.191-7.19 2.733 2.733a1.85 1.85 0 0 0 .964 2.326v6.66a1.849 1.849 0 1 0 1.54 0V8.957l2.508 2.508a1.85 1.85 0 1 0 1.09-1.09l-2.634-2.634a1.85 1.85 0 0 0-2.378-2.377L8.73 2.63 10.91.451a1.54 1.54 0 0 1 2.179 0l10.459 10.46a1.54 1.54 0 0 1 0 2.179z"/>
