<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 44" width="100%" height="100%">
  <defs>
    <!-- Arctic Glacial Frost Flowing Wave Gradient -->
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc">
        <animate attributeName="stop-color"
          values="#f8fafc; #93c5fd; #7dd3fc; #a5f3fc; #f8fafc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="25%" stop-color="#a5f3fc">
        <animate attributeName="stop-color"
          values="#a5f3fc; #f8fafc; #93c5fd; #7dd3fc; #a5f3fc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="50%" stop-color="#7dd3fc">
        <animate attributeName="stop-color"
          values="#7dd3fc; #a5f3fc; #f8fafc; #93c5fd; #7dd3fc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="75%" stop-color="#93c5fd">
        <animate attributeName="stop-color"
          values="#93c5fd; #7dd3fc; #a5f3fc; #f8fafc; #93c5fd"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
      <stop offset="100%" stop-color="#f8fafc">
        <animate attributeName="stop-color"
          values="#f8fafc; #93c5fd; #7dd3fc; #a5f3fc; #f8fafc"
          keyTimes="0; 0.25; 0.5; 0.75; 1"
          dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      </stop>
    </linearGradient>

    <!-- Diamond Ice Glint Sweep Gradient (GitPulse Mobile Effect) -->
    <linearGradient id="shimmerSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="38%" stop-color="#a5f3fc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="62%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask for Shimmer Sweep -->
    <mask id="tsTextMask">
      <text x="250" y="27" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="900" letter-spacing="3.5"
        fill="#ffffff">
        TECH STACK
      </text>
    </mask>

    <!-- Optimized Star Glow Filter (Lightweight & Smooth) -->
    <filter id="tsGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes headingFloat {
      0%, 100% {
        transform: translateY(2.5px);
      }
      50% {
        transform: translateY(-2.5px);
      }
    }
    .floating-layer {
      animation: headingFloat 3.2s ease-in-out infinite;
      will-change: transform;
    }
  </style>

  <!-- Zero-Gravity Gentle Float Animation -->
  <g class="floating-layer">
    <animateTransform attributeName="transform" type="translate"
      values="0 2.5; 0 -2.5; 0 2.5"
      keyTimes="0; 0.5; 1"
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

    <!-- Ambient Twinkling Cosmic Dots -->
    <circle cx="144" cy="24" r="1.8" fill="#00f5d4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="134" cy="24" r="1" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="356" cy="24" r="1.8" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="366" cy="24" r="1" fill="#00f5d4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Glowing Background Aura Layer -->
    <text x="250" y="27" text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="19" font-weight="900" letter-spacing="3.5"
      fill="url(#tsGrad)" filter="url(#tsGlow)">
      <animate attributeName="opacity"
        values="0.4;0.9;0.4"
        dur="3.2s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      TECH STACK
    </text>

    <!-- Sharp Foreground Text Layer -->
    <text x="250" y="27" text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="19" font-weight="900" letter-spacing="3.5"
      fill="url(#tsGrad)">
      TECH STACK
    </text>

    <!-- Shimmer Glint Sweep Layer (GitPulse Mobile Effect) -->
    <g mask="url(#tsTextMask)">
      <rect x="-150" y="0" width="130" height="44" fill="url(#shimmerSweepGrad)">
        <animate attributeName="x"
          values="-150; 520"
          dur="3.2s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>

    <!-- Sci-Fi HUD Underline Accent -->
    <line x1="160" y1="35" x2="340" y2="35"
      stroke="url(#tsGrad)" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
