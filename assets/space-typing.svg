<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 44" width="100%" height="100%">
  <defs>
    <!-- Space Cyan & Electric Blue Gradient (Identical to space-text.svg) -->
    <linearGradient id="cosmicThemeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Star & Ambient Glow Filter (Identical to space-text.svg) -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 4-Pointed Cosmic Star Path Definition -->
    <g id="twinkleStar">
      <path d="M 0 -6 L 1.3 -1.3 L 6 0 L 1.3 1.3 L 0 6 L -1.3 1.3 L -6 0 L -1.3 -1.3 Z" fill="#00f5d4" filter="url(#starGlow)"/>
      <circle cx="0" cy="0" r="1.1" fill="#ffffff"/>
    </g>

    <!-- ================= CLIP PATHS (16s Cycle) ================= -->
    <!-- Phrase 1: Start X=108, Width=368 -->
    <clipPath id="clipP1">
      <rect x="108" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 368; 368; 0; 0; 0"
          keyTimes="0; 0.0125; 0.09375; 0.2125; 0.23125; 0.25; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 2: Start X=145, Width=295 -->
    <clipPath id="clipP2">
      <rect x="145" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 295; 295; 0; 0; 0"
          keyTimes="0; 0.25; 0.2625; 0.34375; 0.4625; 0.48125; 0.50; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 3: Start X=157, Width=270 -->
    <clipPath id="clipP3">
      <rect x="157" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 270; 270; 0; 0; 0"
          keyTimes="0; 0.50; 0.5125; 0.59375; 0.7125; 0.73125; 0.75; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 4: Start X=110, Width=364 -->
    <clipPath id="clipP4">
      <rect x="110" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 364; 364; 0; 0"
          keyTimes="0; 0.75; 0.7625; 0.84375; 0.9625; 0.98125; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .cosmic-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2.2px;
      dominant-baseline: central;
    }
    .cursor-neon {
      fill: #00f5d4;
      animation: cursorBlink 0.75s step-end infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Zero-Gravity Gentle Float -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 1.8; 0 -1.8; 0 1.8"
      dur="3.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- ============================================== -->
    <!-- DENSE TWINKLING STARDUST (BINTIK BINTANG)     -->
    <!-- ============================================== -->
    <g fill="#ffffff">
      <!-- Left Stardust Cluster -->
      <circle cx="16" cy="22" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="26" cy="12" r="0.9">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="36" cy="32" r="1.2" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="48" cy="15" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="29" r="1.3" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="11" r="0.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.7s" repeatCount="indefinite"/>
      </circle>

      <!-- Upper Edge Ambient Stars (Above Text) -->
      <circle cx="112" cy="7" r="0.9" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="165" cy="6" r="1.1" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="225" cy="8" r="0.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="285" cy="6" r="1.2" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="345" cy="7" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="405" cy="6" r="1.1" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="468" cy="8" r="0.8" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.1s" repeatCount="indefinite"/>
      </circle>

      <!-- Lower Edge Ambient Stars (Below Text) -->
      <circle cx="130" cy="37" r="1.0" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="38" r="0.9" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="36" r="1.2" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" cy="38" r="0.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="370" cy="37" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="36" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Right Stardust Cluster -->
      <circle cx="510" cy="13" r="0.9" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="522" cy="30" r="1.2" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="535" cy="15" r="1.0" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="548" cy="31" r="1.3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="564" cy="22" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="572" cy="11" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Micro Sparkles (✦) -->
    <path d="M 38 21 L 39 19 L 40 21 L 42 21 L 40.5 22 L 41 24 L 39 22.5 L 37 24 L 37.5 22 Z" fill="#00f5d4" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 540 20 L 541 18 L 542 20 L 544 20 L 542.5 21 L 543 23 L 541 21.5 L 539 23 L 539.5 21 Z" fill="#38bdf8" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite"/>
    </path>

    <!-- ================= PHRASE 1 ================= -->
    <!-- Left Star: 84 | Text: 108..471.7 | Cursor: 108->473 (direct touch on 'r') | Right Star: 495 -->
    <g>
      <animate attributeName="opacity"
        values="1; 1; 0; 0; 0"
        keyTimes="0; 0.22; 0.245; 0.25; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="84" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP1)">
        <text x="108" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">Web Developer &amp; UI/UX Designer</text>
        <text x="108" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">Web Developer &amp; UI/UX Designer</text>
      </g>

      <!-- Cursor 1 (Directly hugs 'r' at 473, 22px space before right star at 495) -->
      <rect y="11" width="2.5" height="21" rx="1.2" class="cursor-neon" filter="url(#starGlow)">
        <animate attributeName="x"
          values="108; 108; 473; 473; 108; 108; 108"
          keyTimes="0; 0.0125; 0.09375; 0.2125; 0.23125; 0.25; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="visible; visible; visible; hidden; hidden; hidden"
          keyTimes="0; 0.005; 0.225; 0.235; 0.25; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 22px spacing -->
      <use href="#twinkleStar" x="495" y="22"/>
    </g>

    <!-- ================= PHRASE 2 ================= -->
    <!-- Left Star: 121 | Text: 145..435.9 | Cursor: 145->437 (direct touch on '5') | Right Star: 459 -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.25; 0.26; 0.47; 0.495; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="121" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP2)">
        <text x="145" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">Crafting Project Web HS15</text>
        <text x="145" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">Crafting Project Web HS15</text>
      </g>

      <!-- Cursor 2 (Directly hugs '5' at 437, 22px space before right star at 459) -->
      <rect y="11" width="2.5" height="21" rx="1.2" class="cursor-neon" filter="url(#starGlow)" visibility="hidden">
        <animate attributeName="x"
          values="145; 145; 145; 437; 437; 145; 145; 145"
          keyTimes="0; 0.25; 0.2625; 0.34375; 0.4625; 0.48125; 0.50; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="hidden; visible; visible; hidden; hidden; hidden"
          keyTimes="0; 0.255; 0.475; 0.485; 0.50; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 22px spacing -->
      <use href="#twinkleStar" x="459" y="22"/>
    </g>

    <!-- ================= PHRASE 3 ================= -->
    <!-- Left Star: 133 | Text: 157..422.6 | Cursor: 157->424 (direct touch on 't') | Right Star: 446 -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.50; 0.51; 0.72; 0.745; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="133" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP3)">
        <text x="157" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">Exploring Flutter &amp; Dart</text>
        <text x="157" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">Exploring Flutter &amp; Dart</text>
      </g>

      <!-- Cursor 3 (Directly hugs 't' at 424 with 0 gap, 22px space before right star at 446) -->
      <rect y="11" width="2.5" height="21" rx="1.2" class="cursor-neon" filter="url(#starGlow)" visibility="hidden">
        <animate attributeName="x"
          values="157; 157; 157; 424; 424; 157; 157; 157"
          keyTimes="0; 0.50; 0.5125; 0.59375; 0.7125; 0.73125; 0.75; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="hidden; visible; visible; hidden; hidden; hidden"
          keyTimes="0; 0.505; 0.725; 0.735; 0.75; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 22px spacing -->
      <use href="#twinkleStar" x="446" y="22"/>
    </g>

    <!-- ================= PHRASE 4 ================= -->
    <!-- Left Star: 86 | Text: 110..469.2 | Cursor: 110->471 (direct touch on 'l') | Right Star: 493 -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.75; 0.76; 0.97; 0.995; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="86" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP4)">
        <text x="110" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">PC nyala, tapi yang dibuka novel</text>
        <text x="110" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">PC nyala, tapi yang dibuka novel</text>
      </g>

      <!-- Cursor 4 (Directly hugs 'l' at 471, 22px space before right star at 493) -->
      <rect y="11" width="2.5" height="21" rx="1.2" class="cursor-neon" filter="url(#starGlow)" visibility="hidden">
        <animate attributeName="x"
          values="110; 110; 110; 471; 471; 110; 110"
          keyTimes="0; 0.75; 0.7625; 0.84375; 0.9625; 0.98125; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="hidden; visible; visible; hidden; hidden"
          keyTimes="0; 0.755; 0.975; 0.985; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 22px spacing -->
      <use href="#twinkleStar" x="493" y="22"/>
    </g>
  </g>
</svg>
