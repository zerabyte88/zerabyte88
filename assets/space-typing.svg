<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 44" width="100%" height="100%">
  <defs>
    <!-- Space Cyan & Electric Blue Gradient (Identical to space-text.svg) -->
    <linearGradient id="cosmicThemeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Star & Ambient Glow Filter (Identical to space-text.svg) -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 4-Pointed Cosmic Star Path Definition -->
    <g id="twinkleStar">
      <path d="M 0 -6 L 1.3 -1.3 L 6 0 L 1.3 1.3 L 0 6 L -1.3 1.3 L -6 0 L -1.3 -1.3 Z" fill="#00f5d4" filter="url(#starGlow)"/>
      <circle cx="0" cy="0" r="1.1" fill="#ffffff"/>
    </g>

    <!-- ================= CLIP PATHS (16s Cycle) ================= -->
    <!-- Phrase 1: Start X=103, Width=385 -->
    <clipPath id="clipP1">
      <rect x="103" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 385; 385; 0; 0; 0"
          keyTimes="0; 0.0125; 0.09375; 0.2125; 0.23125; 0.25; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 2: Start X=130, Width=330 -->
    <clipPath id="clipP2">
      <rect x="130" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 330; 330; 0; 0; 0"
          keyTimes="0; 0.25; 0.2625; 0.34375; 0.4625; 0.48125; 0.50; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 3: Start X=143, Width=305 -->
    <clipPath id="clipP3">
      <rect x="143" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 305; 305; 0; 0; 0"
          keyTimes="0; 0.50; 0.5125; 0.59375; 0.7125; 0.73125; 0.75; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 4: Start X=96, Width=398 -->
    <clipPath id="clipP4">
      <rect x="96" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 398; 398; 0; 0"
          keyTimes="0; 0.75; 0.7625; 0.84375; 0.9625; 0.98125; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .cosmic-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2.2px;
      dominant-baseline: central;
    }
    .cursor-neon {
      fill: #00f5d4;
      animation: cursorBlink 0.75s step-end infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Zero-Gravity Gentle Float -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 1.8; 0 -1.8; 0 1.8"
      dur="3.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Subtle Twinkling Ambient Corner Stars -->
    <circle cx="16" cy="22" r="1.1" fill="#00f5d4">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="564" cy="22" r="1.1" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- ================= PHRASE 1 ================= -->
    <!-- Left Star: 79 | Text: 103..478 | Cursor: 103->482 | Right Star: 506 -->
    <g>
      <animate attributeName="opacity"
        values="1; 1; 0; 0; 0"
        keyTimes="0; 0.22; 0.245; 0.25; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="79" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP1)">
        <text x="103" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          Web Developer &amp; UI/UX Designer
        </text>
        <text x="103" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          Web Developer &amp; UI/UX Designer
        </text>
      </g>

      <!-- Cursor 1 (Stops at 482, stays safely before right star at 506) -->
      <rect y="11" width="3" height="21" rx="1.5" class="cursor-neon" filter="url(#starGlow)">
        <animate attributeName="x"
          values="103; 103; 482; 482; 103; 103; 103"
          keyTimes="0; 0.0125; 0.09375; 0.2125; 0.23125; 0.25; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="visible; visible; visible; hidden; hidden; hidden"
          keyTimes="0; 0.005; 0.225; 0.235; 0.25; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 24px spacing -->
      <use href="#twinkleStar" x="506" y="22"/>
    </g>

    <!-- ================= PHRASE 2 ================= -->
    <!-- Left Star: 106 | Text: 130..450 | Cursor: 130->454 | Right Star: 478 -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.25; 0.26; 0.47; 0.495; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="106" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP2)">
        <text x="130" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          Crafting Project Web HS15
        </text>
        <text x="130" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          Crafting Project Web HS15
        </text>
      </g>

      <!-- Cursor 2 (Stops at 454, stays safely before right star at 478) -->
      <rect y="11" width="3" height="21" rx="1.5" class="cursor-neon" filter="url(#starGlow)" visibility="hidden">
        <animate attributeName="x"
          values="130; 130; 130; 454; 454; 130; 130; 130"
          keyTimes="0; 0.25; 0.2625; 0.34375; 0.4625; 0.48125; 0.50; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="hidden; visible; visible; hidden; hidden; hidden"
          keyTimes="0; 0.255; 0.475; 0.485; 0.50; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 24px spacing -->
      <use href="#twinkleStar" x="478" y="22"/>
    </g>

    <!-- ================= PHRASE 3 ================= -->
    <!-- Left Star: 119 | Text: 143..438 | Cursor: 143->442 | Right Star: 466 -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.50; 0.51; 0.72; 0.745; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="119" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP3)">
        <text x="143" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          Exploring Flutter &amp; Dart
        </text>
        <text x="143" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          Exploring Flutter &amp; Dart
        </text>
      </g>

      <!-- Cursor 3 (Stops at 442, stays safely before right star at 466) -->
      <rect y="11" width="3" height="21" rx="1.5" class="cursor-neon" filter="url(#starGlow)" visibility="hidden">
        <animate attributeName="x"
          values="143; 143; 143; 442; 442; 143; 143; 143"
          keyTimes="0; 0.50; 0.5125; 0.59375; 0.7125; 0.73125; 0.75; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="hidden; visible; visible; hidden; hidden; hidden"
          keyTimes="0; 0.505; 0.725; 0.735; 0.75; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 24px spacing -->
      <use href="#twinkleStar" x="466" y="22"/>
    </g>

    <!-- ================= PHRASE 4 ================= -->
    <!-- Left Star: 72 | Text: 96..484 | Cursor: 96->488 | Right Star: 512 -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.75; 0.76; 0.97; 0.995; 1"
        dur="16s" repeatCount="indefinite"/>

      <!-- Left Star with generous 24px spacing -->
      <use href="#twinkleStar" x="72" y="22"/>

      <!-- Typed Text -->
      <g clip-path="url(#clipP4)">
        <text x="96" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          PC nyala, tapi yang dibuka novel
        </text>
        <text x="96" y="22" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          PC nyala, tapi yang dibuka novel
        </text>
      </g>

      <!-- Cursor 4 (Stops at 488, stays safely before right star at 512) -->
      <rect y="11" width="3" height="21" rx="1.5" class="cursor-neon" filter="url(#starGlow)" visibility="hidden">
        <animate attributeName="x"
          values="96; 96; 96; 488; 488; 96; 96"
          keyTimes="0; 0.75; 0.7625; 0.84375; 0.9625; 0.98125; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="visibility"
          values="hidden; visible; visible; hidden; hidden"
          keyTimes="0; 0.755; 0.975; 0.985; 1"
          dur="16s" repeatCount="indefinite"/>
      </rect>

      <!-- Right Star with generous 24px spacing -->
      <use href="#twinkleStar" x="512" y="22"/>
    </g>
  </g>
</svg>
