<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 44" width="100%" height="100%">
  <defs>
    <!-- Space Cyan & Electric Blue Gradient (Matches Theme Perfectly) -->
    <linearGradient id="cosmicThemeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Star & Ambient Glow Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ================= CLIP PATHS (16s Cycle: 4s per Phrase) ================= -->
    <!-- Progressive typing sweep (0 -> 580) across canvas guarantees full reveal on all OSes -->
    <!-- Phrase 1: Active 0s - 4s (Sweep: 0.1s - 1.05s) -->
    <clipPath id="clipP1">
      <rect x="0" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 580; 580; 0; 0"
          keyTimes="0; 0.006; 0.066; 0.244; 0.25; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 2: Active 4s - 8s (Sweep: 4.1s - 5.05s) -->
    <clipPath id="clipP2">
      <rect x="0" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 580; 580; 0; 0"
          keyTimes="0; 0.25; 0.256; 0.316; 0.494; 0.50; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 3: Active 8s - 12s (Sweep: 8.1s - 9.05s) -->
    <clipPath id="clipP3">
      <rect x="0" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 580; 580; 0; 0"
          keyTimes="0; 0.50; 0.506; 0.566; 0.744; 0.75; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>

    <!-- Phrase 4: Active 12s - 16s (Sweep: 12.1s - 13.05s) -->
    <clipPath id="clipP4">
      <rect x="0" y="0" width="0" height="44">
        <animate attributeName="width"
          values="0; 0; 0; 580; 580; 0; 0"
          keyTimes="0; 0.75; 0.756; 0.816; 0.994; 1; 1"
          dur="16s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .cosmic-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      dominant-baseline: central;
    }
    .cursor-neon {
      fill: #00f5d4;
      font-weight: 300;
      letter-spacing: 0;
      animation: cursorBlink 0.75s step-end infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- ============================================== -->
  <!-- ZERO-GRAVITY GENTLE FLOAT ROOT CONTAINER       -->
  <!-- ============================================== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 1.8; 0 -1.8; 0 1.8"
      dur="3.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- ============================================== -->
    <!-- DENSE TWINKLING STARDUST (BINTIK BINTANG)     -->
    <!-- ============================================== -->
    <g fill="#ffffff">
      <!-- Left Stardust Cluster -->
      <circle cx="16" cy="22" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="26" cy="12" r="0.9">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="36" cy="32" r="1.2" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="48" cy="15" r="1.0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="29" r="1.3" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="11" r="0.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.7s" repeatCount="indefinite"/>
      </circle>

      <!-- Upper Edge Ambient Stars (Above Text) -->
      <circle cx="112" cy="7" r="0.9" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="165" cy="6" r="1.1" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="225" cy="8" r="0.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="285" cy="6" r="1.2" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="345" cy="7" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="405" cy="6" r="1.1" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="468" cy="8" r="0.8" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.1s" repeatCount="indefinite"/>
      </circle>

      <!-- Lower Edge Ambient Stars (Below Text) -->
      <circle cx="130" cy="37" r="1.0" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="38" r="0.9" fill="#00f5d4">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="36" r="1.2" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" cy="38" r="0.8" fill="#38bdf8">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="370" cy="37" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="36" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Right Stardust Cluster -->
      <circle cx="510" cy="13" r="0.9" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="522" cy="30" r="1.2" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="535" cy="15" r="1.0" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="548" cy="31" r="1.3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="564" cy="22" r="1.1" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="572" cy="11" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Micro Sparkles (✦) -->
    <path d="M 38 21 L 39 19 L 40 21 L 42 21 L 40.5 22 L 41 24 L 39 22.5 L 37 24 L 37.5 22 Z" fill="#00f5d4" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 540 20 L 541 18 L 542 20 L 544 20 L 542.5 21 L 543 23 L 541 21.5 L 539 23 L 539.5 21 Z" fill="#38bdf8" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite"/>
    </path>

    <!-- ============================================== -->
    <!-- PHRASE 1: WEB DEVELOPER & UI/UX DESIGNER       -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="1; 1; 0; 0; 0"
        keyTimes="0; 0.220; 0.245; 0.250; 1"
        dur="16s" repeatCount="indefinite"/>

      <g clip-path="url(#clipP1)">
        <!-- Ambient Glow Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Web Developer &amp; UI/UX Designer</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>

        <!-- Crisp Foreground Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Web Developer &amp; UI/UX Designer</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- PHRASE 2: DEVELOPING PROJECT WEB HS15          -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.245; 0.250; 0.470; 0.495; 1"
        dur="16s" repeatCount="indefinite"/>

      <g clip-path="url(#clipP2)">
        <!-- Ambient Glow Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Developing Project Web HS15</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>

        <!-- Crisp Foreground Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Developing Project Web HS15</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- PHRASE 3: EXPLORING FLUTTER & DART             -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.495; 0.500; 0.720; 0.745; 1"
        dur="16s" repeatCount="indefinite"/>

      <g clip-path="url(#clipP3)">
        <!-- Ambient Glow Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Exploring Flutter &amp; Dart</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>

        <!-- Crisp Foreground Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Exploring Flutter &amp; Dart</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- PHRASE 4: DESIGNING INTUITIVE USER EXPERIENCES -->
    <!-- ============================================== -->
    <g>
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.745; 0.750; 0.970; 0.995; 1"
        dur="16s" repeatCount="indefinite"/>

      <g clip-path="url(#clipP4)">
        <!-- Ambient Glow Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)" filter="url(#starGlow)" opacity="0.65">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Designing Intuitive User Experiences</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>

        <!-- Crisp Foreground Text Layer -->
        <text x="290" y="22" text-anchor="middle" class="cosmic-text" fill="url(#cosmicThemeGrad)">
          <tspan fill="#00f5d4">✦  </tspan>
          <tspan fill="url(#cosmicThemeGrad)">Designing Intuitive User Experiences</tspan>
          <tspan class="cursor-neon" fill="#00f5d4">|</tspan>
          <tspan fill="#38bdf8">  ✦</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
