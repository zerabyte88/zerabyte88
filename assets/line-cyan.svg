<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%" height="100%">
  <defs>
    <!-- Cyan Glowing Beam Gradient -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00bbf9" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1"/>
      <stop offset="65%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#00bbf9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Center White-Hot Core Light -->
    <linearGradient id="whiteCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sub-beam Gradient for Decorative Accents -->
    <linearGradient id="subBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bbf9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00bbf9" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#00bbf9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Sharp Neon Glow Filter -->
    <filter id="sharpGlow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- 1. Ambient Glow Bloom behind the line -->
    <ellipse cx="500" cy="20" rx="420" ry="7" fill="#00f5d4" opacity="0.3" filter="url(#ambientGlow)">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 2. Main Glowing Laser Beam -->
    <line x1="60" y1="20" x2="940" y2="20" stroke="url(#beamGradient)" stroke-width="3" stroke-linecap="round" filter="url(#sharpGlow)">
      <animate attributeName="stroke-width" values="2.5;3.8;2.5" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- 3. White Core Intense Line -->
    <line x1="220" y1="20" x2="780" y2="20" stroke="url(#whiteCore)" stroke-width="1.4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- 4. Subtle Upper & Lower Accent Line Segments (Sci-Fi / Space HUD feel) -->
    <line x1="320" y1="13" x2="430" y2="13" stroke="url(#subBeam)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="570" y1="13" x2="680" y2="13" stroke="url(#subBeam)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="320" y1="27" x2="430" y2="27" stroke="url(#subBeam)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="570" y1="27" x2="680" y2="27" stroke="url(#subBeam)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 5. Center Ornament: Sleek Cosmic Diamond with Glowing Core -->
    <g transform="translate(500, 20)">
      <!-- Outer Diamond -->
      <polygon points="0,-7 7,0 0,7 -7,0" fill="none" stroke="#00f5d4" stroke-width="1.2" filter="url(#sharpGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </polygon>
      <!-- Inner Glowing Core Diamond -->
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#00f5d4">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </polygon>
      <!-- Center Bright White Dot -->
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>

    <!-- 6. Flanking Satellite Accent Nodes (Constellation Dots) -->
    <!-- Left Flank -->
    <circle cx="465" cy="20" r="2.2" fill="#00f5d4" filter="url(#sharpGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="445" cy="20" r="1.5" fill="#00bbf9" opacity="0.85"/>
    <polygon points="300,18 302,20 300,22 298,20" fill="#00f5d4" opacity="0.75"/>
    <circle cx="160" cy="20" r="1.8" fill="#00bbf9" opacity="0.65"/>
    <circle cx="90" cy="20" r="1.2" fill="#00f5d4" opacity="0.45"/>

    <!-- Right Flank -->
    <circle cx="535" cy="20" r="2.2" fill="#00f5d4" filter="url(#sharpGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="20" r="1.5" fill="#00bbf9" opacity="0.85"/>
    <polygon points="700,18 702,20 700,22 698,20" fill="#00f5d4" opacity="0.75"/>
    <circle cx="840" cy="20" r="1.8" fill="#00bbf9" opacity="0.65"/>
    <circle cx="910" cy="20" r="1.2" fill="#00f5d4" opacity="0.45"/>

    <!-- 7. Twinkling Cosmic Micro-Stars along the Line (Hovering Dust & Sparks) -->
    <!-- Spark 1 (Top Left) -->
    <g transform="translate(370, 9)">
      <path d="M 0 -4 L 0.8 -0.8 L 4 0 L 0.8 0.8 L 0 4 L -0.8 0.8 L -4 0 L -0.8 -0.8 Z" fill="#00f5d4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="0.8" fill="#ffffff"/>
    </g>

    <!-- Spark 2 (Bottom Right) -->
    <g transform="translate(630, 31)">
      <path d="M 0 -4 L 0.8 -0.8 L 4 0 L 0.8 0.8 L 0 4 L -0.8 0.8 L -4 0 L -0.8 -0.8 Z" fill="#00f5d4">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="0.8" fill="#ffffff"/>
    </g>

    <!-- Spark 3 (Top Right) -->
    <g transform="translate(760, 10)">
      <path d="M 0 -3.5 L 0.7 -0.7 L 3.5 0 L 0.7 0.7 L 0 3.5 L -0.7 0.7 L -3.5 0 L -0.7 -0.7 Z" fill="#00bbf9">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="0.6" fill="#ffffff"/>
    </g>

    <!-- Spark 4 (Bottom Left) -->
    <g transform="translate(240, 30)">
      <path d="M 0 -3.5 L 0.7 -0.7 L 3.5 0 L 0.7 0.7 L 0 3.5 L -0.7 0.7 L -3.5 0 L -0.7 -0.7 Z" fill="#00bbf9">
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="0" r="0.6" fill="#ffffff"/>
    </g>

  </g>
</svg>
