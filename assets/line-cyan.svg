<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="100%">
  <defs>
    <!-- Cyan Glowing Beam Gradient -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00bbf9" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1"/>
      <stop offset="65%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#00bbf9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Center White-Hot Core Light -->
    <linearGradient id="whiteCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="ambientBlur" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Sharp Neon Glow Filter -->
    <filter id="sharpGlow" x="-10%" y="-150%" width="120%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Layer 1: Wide Soft Ambient Neon Glow (Background Bloom) -->
    <ellipse cx="500" cy="15" rx="420" ry="8" fill="#00f5d4" opacity="0.35" filter="url(#ambientBlur)">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Layer 2: Main Cyan Laser Line (Thick Glowing Beam) -->
    <line x1="40" y1="15" x2="960" y2="15" stroke="url(#beamGradient)" stroke-width="4.5" stroke-linecap="round" filter="url(#sharpGlow)">
      <animate attributeName="stroke-width" values="4;5.5;4" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Layer 3: Intense White-Hot Center Core Line -->
    <line x1="200" y1="15" x2="800" y2="15" stroke="url(#whiteCore)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
