    <g transform="translate(118, 146)" fill="#090b19" stroke="#f9a8d4" stroke-opacity="0.16" stroke-width="0.6">
      <!-- Kasagi (Top Curved Beam) -->
      <path d="M 0 8 Q 42 15 84 8 L 81 15 Q 42 20 3 15 Z"/>
      <!-- Nuki (Lower Cross Beam) -->
