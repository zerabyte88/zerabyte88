      <path d="M -8 260 L -8 95 C 4 115 16 142 18 175 C 20 205 12 234 26 260 Z" fill="#090b19"/>
      <path d="M -4 148 C 12 122 24 94 46 70 C 76 38 128 24 186 22 C 202 21 216 24 226 30 C 212 28 198 28 182 31 C 134 38 92 52 64 80 C 44 100 32 128 20 162 Z" fill="#090b19"/>
      <!-- Secondary Branches & Twigs -->
