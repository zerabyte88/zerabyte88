<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight Indigo Sky -->
    <linearGradient id="zenSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1e"/>
      <stop offset="52%" stop-color="#141933"/>
      <stop offset="100%" stop-color="#1d203d"/>
    </linearGradient>

    <!-- Full Moon Radial Halo -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#f9a8d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#141933" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Surface -->
    <radialGradient id="moonDisk" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="65%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>

    <!-- Soft Horizon Sakura Mist -->
    <radialGradient id="sakuraMist" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0e1e" stop-opacity="0"/>
    </radialGradient>

    <!-- Headline Fill Gradient -->
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <!-- Headline Glint Sweep -->
    <linearGradient id="glintSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#f9a8d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <!-- Headline Mask for Glint -->
    <mask id="headlineMask">
      <g font-family="Verdana, Geneva, 'DejaVu Sans', -apple-system, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">
        <text x="600" y="114" font-size="38" letter-spacing="4">MALAS NGODING?</text>
        <text x="600" y="156" font-size="30" letter-spacing="3.5">BUKA FACEBOOK SOLUSINYA</text>
      </g>
    </mask>

    <!-- Rounded Canvas Clip -->
    <clipPath id="headerClip">
      <rect x="0" y="0" width="1200" height="260" rx="14"/>
    </clipPath>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#headerClip)">
    <!-- Background Sky -->
    <rect x="0" y="0" width="1200" height="260" fill="url(#zenSky)"/>
    <rect x="0" y="0" width="1200" height="260" fill="url(#sakuraMist)"/>

    <!-- Subtle Distant Stars -->
    <g fill="#fff1f2">
      <circle cx="95" cy="46" r="1.2" opacity="0.45">
        <animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="34" r="1.0" opacity="0.35">
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="52" r="1.3" fill="#fbcfe8" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="42" r="1.1" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="885" cy="64" r="1.4" fill="#fde68a" opacity="0.45">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1135" cy="48" r="1.1" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Full Moon & Halo -->
    <g>
      <circle cx="1015" cy="82" r="92" fill="url(#moonHalo)">
        <animate attributeName="opacity" values="0.82;1;0.82" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1015" cy="82" r="34" fill="url(#moonDisk)"/>
      <circle cx="1004" cy="74" r="6" fill="#fde68a" opacity="0.32"/>
      <circle cx="1026" cy="91" r="4.5" fill="#fde68a" opacity="0.28"/>
    </g>

    <!-- Subtle Distant Clouds -->
    <g fill="#262b52" opacity="0.45">
      <path d="M 880 105 Q 920 92 965 100 Q 1000 88 1040 100 Q 1085 95 1118 106 Q 1060 112 960 112 Z">
        <animateTransform attributeName="transform" type="translate" values="-8,0;8,0;-8,0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M 110 88 Q 155 76 205 84 Q 248 74 295 88 Q 225 95 145 94 Z" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="6,0;-6,0;6,0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Layered Minimalist Mountains -->
    <path d="M 0 260 L 0 206 Q 140 165 295 196 Q 470 158 650 198 Q 845 152 1030 190 Q 1125 170 1200 188 L 1200 260 Z" fill="#101329"/>
    <path d="M 0 260 L 0 224 Q 175 195 360 222 Q 565 196 770 224 Q 985 198 1200 220 L 1200 260 Z" fill="#090b19"/>

    <!-- Minimalist Torii Gate Silhouette on Left Horizon -->
    <g transform="translate(118, 146)" fill="#090b19" stroke="#f9a8d4" stroke-opacity="0.16" stroke-width="0.6">
      <!-- Kasagi (Top Curved Beam) -->
      <path d="M 0 8 Q 42 15 84 8 L 81 15 Q 42 20 3 15 Z"/>
      <!-- Nuki (Lower Cross Beam) -->
      <rect x="11" y="24" width="62" height="5" rx="1"/>
      <!-- Center Tablet -->
      <rect x="38.5" y="16" width="7" height="10" rx="1"/>
      <!-- Pillars -->
      <rect x="19" y="15" width="6.5" height="56" rx="1"/>
      <rect x="58.5" y="15" width="6.5" height="56" rx="1"/>
    </g>

    <!-- Drifting Sakura Petals -->
    <g>
      <path d="M 0 -5 C 4 -5 6 -1 4 4 C 2 6 -2 6 -4 4 C -6 -1 -4 -5 0 -5 Z" fill="#f9a8d4" opacity="0.78">
        <animateTransform attributeName="transform" type="translate" values="180,-15; 260,120; 330,275" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0.65;0" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -4.5 C 3.5 -4.5 5 -1 3.5 3.5 C 1.5 5 -1.5 5 -3.5 3.5 C -5 -1 -3.5 -4.5 0 -4.5 Z" fill="#fbcfe8" opacity="0.72">
        <animateTransform attributeName="transform" type="translate" values="420,-20; 485,115; 555,275" dur="13.5s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0.55;0" dur="13.5s" begin="-3s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -5 C 4 -5 5.5 -1 3.5 4 C 1.5 5.5 -1.5 5.5 -3.5 4 C -5.5 -1 -4 -5 0 -5 Z" fill="#f9a8d4" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="760,-15; 835,125; 905,275" dur="12.2s" begin="-6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.72;0.5;0" dur="12.2s" begin="-6s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -4 C 3 -4 4.5 -1 3 3 C 1.5 4.5 -1.5 4.5 -3 3 C -4.5 -1 -3 -4 0 -4 Z" fill="#fbcfe8" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="980,-15; 1045,130; 1110,275" dur="10.5s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.68;0.45;0" dur="10.5s" begin="-2s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -4.5 C 3.5 -4.5 5 -1 3.5 3.5 C 1.5 5 -1.5 5 -3.5 3.5 C -5 -1 -3.5 -4.5 0 -4.5 Z" fill="#f9a8d4" opacity="0.68">
        <animateTransform attributeName="transform" type="translate" values="610,-20; 675,110; 740,275" dur="14.5s" begin="-8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0.5;0" dur="14.5s" begin="-8s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -3.8 C 3 -3.8 4.2 -0.8 2.8 3 C 1.2 4.2 -1.2 4.2 -2.8 3 C -4.2 -0.8 -3 -3.8 0 -3.8 Z" fill="#fbcfe8" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="65,-15; 130,130; 195,275" dur="12.8s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.65;0.45;0" dur="12.8s" begin="-5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Centered Bold Headline -->
    <g font-family="Verdana, Geneva, 'DejaVu Sans', -apple-system, sans-serif" font-weight="800" text-anchor="middle" filter="url(#softGlow)">
      <text x="600" y="114" font-size="38" letter-spacing="4" fill="url(#headlineGrad)">MALAS NGODING?</text>
      <text x="600" y="156" font-size="30" letter-spacing="3.5" fill="url(#headlineGrad)">BUKA FACEBOOK SOLUSINYA</text>
    </g>

    <!-- Gentle Masked Glint Sweep over Headline -->
    <g mask="url(#headlineMask)">
      <rect x="-260" y="60" width="240" height="125" fill="url(#glintSweep)">
        <animate attributeName="x" values="-260; 1260" dur="4.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>

    <!-- Subtle Sakura Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="13.5" fill="none" stroke="#f9a8d4" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
