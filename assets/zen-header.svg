        <animateTransform attributeName="transform" type="translate" values="65,-15; 130,130; 195,275" dur="12.8s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.68;0.48;0" dur="12.8s" begin="-5s" repeatCount="indefinite"/>
