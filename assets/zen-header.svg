        <animateTransform attributeName="transform" type="translate" values="-8,0;8,0;-8,0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M 110 88 Q 155 76 205 84 Q 248 74 295 88 Q 225 95 145 94 Z" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="6,0;-6,0;6,0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Layered Minimalist Mountains -->
    <path d="M 0 260 L 0 206 Q 140 165 295 196 Q 470 158 650 198 Q 845 152 1030 190 Q 1125 170 1200 188 L 1200 260 Z" fill="#101329"/>
    <path d="M 0 260 L 0 224 Q 175 195 360 222 Q 565 196 770 224 Q 985 198 1200 220 L 1200 260 Z" fill="#090b19"/>

