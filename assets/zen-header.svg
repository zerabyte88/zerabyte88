<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight Indigo Sky -->
    <linearGradient id="zenSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1e"/>
      <stop offset="52%" stop-color="#141933"/>
      <stop offset="100%" stop-color="#1d203d"/>
    </linearGradient>

    <!-- Full Moon Radial Halo -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#f9a8d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#141933" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Surface -->
    <radialGradient id="moonDisk" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="65%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>

    <!-- Soft Horizon Sakura Mist -->
    <radialGradient id="sakuraMist" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0e1e" stop-opacity="0"/>
    </radialGradient>

    <!-- Headline Fill Gradient -->
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <!-- Headline Glint Sweep -->
    <linearGradient id="glintSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#f9a8d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <!-- Headline Mask for Glint -->
    <mask id="headlineMask">
      <g font-family="Verdana, Geneva, 'DejaVu Sans', -apple-system, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">
        <text x="600" y="114" font-size="38" letter-spacing="4">MALAS NGODING?</text>
        <text x="600" y="156" font-size="30" letter-spacing="3.5">BUKA FACEBOOK SOLUSINYA</text>
      </g>
    </mask>

    <!-- Rounded Canvas Clip -->
    <clipPath id="headerClip">
      <rect x="0" y="0" width="1200" height="260" rx="14"/>
    </clipPath>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#headerClip)">
    <!-- Background Sky -->
    <rect x="0" y="0" width="1200" height="260" fill="url(#zenSky)"/>
    <rect x="0" y="0" width="1200" height="260" fill="url(#sakuraMist)"/>

    <!-- Subtle Distant Stars -->
    <g fill="#fff1f2">
      <circle cx="95" cy="46" r="1.2" opacity="0.45">
        <animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="34" r="1.0" opacity="0.35">
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="52" r="1.3" fill="#fbcfe8" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="42" r="1.1" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="885" cy="64" r="1.4" fill="#fde68a" opacity="0.45">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1135" cy="48" r="1.1" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Full Moon & Halo -->
    <g>
      <circle cx="1015" cy="82" r="92" fill="url(#moonHalo)">
        <animate attributeName="opacity" values="0.82;1;0.82" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1015" cy="82" r="34" fill="url(#moonDisk)"/>
      <circle cx="1004" cy="74" r="6" fill="#fde68a" opacity="0.32"/>
      <circle cx="1026" cy="91" r="4.5" fill="#fde68a" opacity="0.28"/>
    </g>

    <!-- Subtle Distant Clouds -->
    <g fill="#262b52" opacity="0.45">
