<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 125" width="100%" height="100%">
  <defs>
    <!-- Midnight Sky -->
    <linearGradient id="footerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1022"/>
      <stop offset="55%" stop-color="#171b36"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </linearGradient>

    <!-- Calm Dark Pond -->
    <linearGradient id="pondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1f"/>
      <stop offset="100%" stop-color="#080a17"/>
    </linearGradient>

    <!-- Moonlight Reflection Glow -->
    <radialGradient id="pondMoonGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f9a8d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080a17" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="125" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <!-- Sky -->
    <rect x="0" y="0" width="1200" height="125" fill="url(#footerSky)"/>

    <!-- Faint Horizon Stars -->
    <g fill="#fff1f2" opacity="0.4">
      <circle cx="150" cy="24" r="1.1">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="410" cy="18" r="1.0" fill="#fbcfe8">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="845" cy="22" r="1.2" fill="#fde68a">
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1075" cy="28" r="1.0">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Distant Hills -->
    <path d="M 0 64 Q 180 34 390 54 Q 600 32 820 52 Q 1020 34 1200 56 L 1200 72 L 0 72 Z" fill="#101329"/>
    <path d="M 0 70 Q 250 52 520 66 Q 790 48 1200 68 L 1200 76 L 0 76 Z" fill="#0b0e1e"/>

    <!-- Calm Dark Pond -->
    <rect x="0" y="68" width="1200" height="57" fill="url(#pondGrad)"/>
    <ellipse cx="600" cy="68" rx="190" ry="44" fill="url(#pondMoonGlow)"/>

    <!-- Horizon Waterline -->
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#f9a8d4" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Animated Golden Moonlight Ripples -->
    <g fill="#fde68a" opacity="0.7">
      <rect x="556" y="75" width="88" height="2.2" rx="1.1" opacity="0.65">
        <animate attributeName="width" values="88;104;88" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="x" values="556;548;556" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.78;0.45" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="568" y="84" width="64" height="2" rx="1" opacity="0.55">
        <animate attributeName="width" values="64;78;64" dur="5.0s" repeatCount="indefinite"/>
        <animate attributeName="x" values="568;561;568" dur="5.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.68;0.35" dur="5.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="578" y="93" width="44" height="1.8" rx="0.9" opacity="0.45">
        <animate attributeName="width" values="44;56;44" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="578;572;578" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.58;0.25" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="586" y="102" width="28" height="1.6" rx="0.8" opacity="0.35">
        <animate attributeName="width" values="28;38;28" dur="5.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="586;581;586" dur="5.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="592" y="110" width="16" height="1.4" rx="0.7" opacity="0.28">
        <animate attributeName="width" values="16;24;16" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="x" values="592;588;592" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 3 Floating Sakura Petals on the Pond -->
    <g>
      <ellipse cx="290" cy="88" rx="5.5" ry="2.6" fill="#f9a8d4" opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0,0; 18,2; 0,0" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="865" cy="96" rx="5" ry="2.3" fill="#fbcfe8" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; -16,2; 0,0" dur="10.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="445" cy="107" rx="4.2" ry="2" fill="#f9a8d4" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 14,-1.5; 0,0" dur="8.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Subtle Sakura Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="123.5" rx="13.5" fill="none" stroke="#f9a8d4" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
