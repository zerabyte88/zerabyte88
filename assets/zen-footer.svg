<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 125" width="100%" height="100%">
  <defs>
    <!-- Midnight Sky -->
    <linearGradient id="footerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1022"/>
      <stop offset="55%" stop-color="#171b36"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </linearGradient>

    <!-- Calm Moonlit Pond -->
    <linearGradient id="pondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192347"/>
      <stop offset="35%" stop-color="#101733"/>
      <stop offset="100%" stop-color="#070a18"/>
    </linearGradient>

    <!-- Waterline Horizon Shimmer -->
    <linearGradient id="waterlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.22"/>
      <stop offset="32%" stop-color="#a5b4fc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fef9c3" stop-opacity="0.85"/>
      <stop offset="68%" stop-color="#a5b4fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Moonlight Reflection Glow -->
    <radialGradient id="pondMoonGlow" cx="50%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.52"/>
      <stop offset="35%" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="68%" stop-color="#f9a8d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070a18" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Sakura Branch Pond Reflection -->
    <radialGradient id="sakuraPondGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#070a18" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="footerClip">
      <rect x="0" y="0" width="1200" height="125" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <!-- Sky -->
    <rect x="0" y="0" width="1200" height="125" fill="url(#footerSky)"/>

    <!-- Faint Horizon Stars -->
    <g fill="#fff1f2" opacity="0.4">
      <circle cx="150" cy="24" r="1.1">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="410" cy="18" r="1.0" fill="#fbcfe8">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="845" cy="22" r="1.2" fill="#fde68a">
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1075" cy="28" r="1.0">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Distant Hills -->
    <path d="M 0 64 Q 180 34 390 54 Q 600 32 820 52 Q 1020 34 1200 56 L 1200 72 L 0 72 Z" fill="#101329"/>
    <path d="M 0 70 Q 250 52 520 66 Q 790 48 1200 68 L 1200 76 L 0 76 Z" fill="#0b0e1e"/>

    <!-- Calm Moonlit Pond -->
    <rect x="0" y="68" width="1200" height="57" fill="url(#pondGrad)"/>
    <ellipse cx="600" cy="68" rx="260" ry="52" fill="url(#pondMoonGlow)"/>
    <!-- Sakura Reflection Glows Beneath Left & Right Branches -->
    <ellipse cx="115" cy="86" rx="130" ry="22" fill="url(#sakuraPondGlow)" opacity="0.26"/>
    <ellipse cx="1130" cy="82" rx="85" ry="15" fill="url(#sakuraPondGlow)" opacity="0.18"/>

    <!-- Luminous Horizon Waterline -->
    <line x1="0" y1="68" x2="1200" y2="68" stroke="url(#waterlineGrad)" stroke-width="1.4"/>

    <!-- Ambient Water Surface Shimmer Streaks (Left & Right) -->
    <g fill="#c7d2fe" opacity="0.22">
      <rect x="70" y="76" width="95" height="1.4" rx="0.7">
        <animate attributeName="opacity" values="0.12;0.34;0.12" dur="5.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="210" y="83" width="120" height="1.2" rx="0.6">
        <animate attributeName="opacity" values="0.28;0.1;0.28" dur="6.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="330" y="95" width="76" height="1.2" rx="0.6" opacity="0.7"/>
      <rect x="135" y="104" width="88" height="1.2" rx="0.6">
        <animate attributeName="opacity" values="0.14;0.32;0.14" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="820" y="78" width="115" height="1.4" rx="0.7">
        <animate attributeName="opacity" values="0.3;0.12;0.3" dur="5.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="965" y="90" width="98" height="1.2" rx="0.6">
        <animate attributeName="opacity" values="0.14;0.34;0.14" dur="5.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="740" y="102" width="84" height="1.2" rx="0.6" opacity="0.7"/>
      <rect x="1030" y="112" width="72" height="1.1" rx="0.55" opacity="0.65"/>
    </g>

    <!-- Clear Golden Moonlight Reflection Column on Water -->
    <g fill="#fef9c3">
      <rect x="526" y="72" width="148" height="2.8" rx="1.4" opacity="0.88">
        <animate attributeName="width" values="148;172;148" dur="4.0s" repeatCount="indefinite"/>
        <animate attributeName="x" values="526;514;526" dur="4.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.72;0.96;0.72" dur="4.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="544" y="79" width="112" height="2.4" rx="1.2" fill="#fde68a" opacity="0.82">
        <animate attributeName="width" values="112;134;112" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="544;533;544" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.62;0.9;0.62" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="558" y="86" width="84" height="2.2" rx="1.1" fill="#fde68a" opacity="0.74">
        <animate attributeName="width" values="84;104;84" dur="5.1s" repeatCount="indefinite"/>
        <animate attributeName="x" values="558;548;558" dur="5.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.52;0.82;0.52" dur="5.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="568" y="94" width="64" height="2.0" rx="1.0" fill="#fde68a" opacity="0.64">
        <animate attributeName="width" values="64;82;64" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="568;559;568" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="577" y="102" width="46" height="1.8" rx="0.9" fill="#fbcfe8" opacity="0.55">
        <animate attributeName="width" values="46;62;46" dur="5.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="577;569;577" dur="5.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="586" y="110" width="28" height="1.6" rx="0.8" fill="#fde68a" opacity="0.46">
        <animate attributeName="width" values="28;40;28" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="x" values="586;580;586" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Overhanging Left Sakura Tree Bank & Branch -->
    <g>
      <!-- Grounded Left Shoreline Bank & Soft Water Shadow -->
      <ellipse cx="42" cy="82" rx="58" ry="8" fill="#04060f" opacity="0.65"/>
      <path d="M -6 84 L -6 56 Q 28 54 54 64 Q 76 72 94 78 Q 62 84 -6 84 Z" fill="#090b19"/>
      <path d="M -6 78 Q 22 66 56 71 Q 74 74 88 79 Q 54 83 -6 83 Z" fill="#101329" opacity="0.85"/>
      <!-- Subtle Shoreline Stones -->
      <ellipse cx="64" cy="76" rx="11" ry="4.2" fill="#13162d"/>
      <ellipse cx="82" cy="78" rx="6.5" ry="2.8" fill="#0e1124"/>
      <line x1="0" y1="82" x2="88" y2="82" stroke="#a5b4fc" stroke-opacity="0.24" stroke-width="0.9"/>

      <!-- Dark Tree Trunk (Rooted into Bank) & Main Bough -->
      <path d="M -6 74 L -6 -4 L 32 -4 C 24 18 18 44 30 68 L 10 74 Z" fill="#090b19"/>
      <path d="M 8 24 C 44 14 96 14 148 24 C 176 30 198 38 218 48 C 194 42 168 37 140 33 C 96 26 52 26 14 38 Z" fill="#090b19"/>
      <path d="M 52 24 C 78 36 106 48 138 56 C 110 54 80 44 48 34 Z" fill="#13162d"/>
      <path d="M 118 22 C 142 12 168 8 194 12 C 168 14 144 19 124 27 Z" fill="#13162d"/>

      <!-- Layered Soft Sakura Blossom Clusters (Left) -->
      <circle cx="24" cy="14" r="18" fill="#f472b6" opacity="0.58"/>
      <circle cx="64" cy="12" r="19" fill="#f472b6" opacity="0.6"/>
      <circle cx="108" cy="16" r="17" fill="#f472b6" opacity="0.58"/>
      <circle cx="152" cy="24" r="14" fill="#f472b6" opacity="0.55"/>
      <circle cx="88" cy="40" r="14" fill="#f472b6" opacity="0.54"/>
      <circle cx="128" cy="52" r="11" fill="#f472b6" opacity="0.52"/>
      <circle cx="48" cy="8" r="15" fill="#f9a8d4" opacity="0.74"/>
      <circle cx="94" cy="10" r="15" fill="#f9a8d4" opacity="0.74"/>
      <circle cx="138" cy="16" r="13" fill="#f9a8d4" opacity="0.72"/>
      <circle cx="178" cy="28" r="11" fill="#f9a8d4" opacity="0.68"/>
      <circle cx="206" cy="44" r="8.5" fill="#f9a8d4" opacity="0.65"/>
      <circle cx="72" cy="34" r="12" fill="#f9a8d4" opacity="0.68"/>
      <circle cx="116" cy="46" r="9.5" fill="#f9a8d4" opacity="0.66"/>
      <circle cx="34" cy="6" r="9" fill="#fbcfe8" opacity="0.82"/>
      <circle cx="82" cy="7" r="9.5" fill="#fbcfe8" opacity="0.84"/>
      <circle cx="128" cy="12" r="8.5" fill="#fbcfe8" opacity="0.8"/>
      <circle cx="168" cy="22" r="7.5" fill="#fbcfe8" opacity="0.78"/>
      <circle cx="196" cy="38" r="6" fill="#fbcfe8" opacity="0.76"/>
      <circle cx="106" cy="42" r="6.5" fill="#fbcfe8" opacity="0.74"/>
      <circle cx="144" cy="54" r="5" fill="#fbcfe8" opacity="0.72"/>
      <circle cx="90" cy="6" r="4.5" fill="#fff1f2" opacity="0.85"/>
      <circle cx="140" cy="12" r="4" fill="#fff1f2" opacity="0.82"/>
      <circle cx="182" cy="24" r="3.8" fill="#fff1f2" opacity="0.82"/>
    </g>

    <!-- Subtle Far-Right Sakura Branch Tip -->
    <g>
      <path d="M 1205 12 C 1176 16 1146 24 1118 34 C 1102 40 1086 44 1072 46 C 1090 46 1110 43 1130 37 C 1156 29 1180 23 1205 22 Z" fill="#090b19"/>
      <path d="M 1164 20 C 1148 12 1130 8 1114 8 C 1130 12 1146 18 1158 24 Z" fill="#13162d"/>

      <circle cx="1182" cy="14" r="13" fill="#f472b6" opacity="0.55"/>
      <circle cx="1146" cy="20" r="12" fill="#f472b6" opacity="0.54"/>
      <circle cx="1114" cy="32" r="10" fill="#f472b6" opacity="0.52"/>
      <circle cx="1172" cy="10" r="10" fill="#f9a8d4" opacity="0.72"/>
      <circle cx="1136" cy="14" r="9.5" fill="#f9a8d4" opacity="0.7"/>
      <circle cx="1102" cy="36" r="8" fill="#f9a8d4" opacity="0.68"/>
      <circle cx="1080" cy="43" r="6" fill="#fbcfe8" opacity="0.75"/>
      <circle cx="1126" cy="12" r="5.5" fill="#fbcfe8" opacity="0.8"/>
      <circle cx="1164" cy="8" r="5.5" fill="#fbcfe8" opacity="0.82"/>
      <circle cx="1108" cy="32" r="4" fill="#fff1f2" opacity="0.84"/>
    </g>

    <!-- 3 Gently Falling Petals Toward the Pond -->
    <g>
      <path d="M 0 -3.5 C 2.8 -3.5 4 -0.6 2.6 2.8 C 1.1 3.8 -1.1 3.8 -2.6 2.8 C -4 -0.6 -2.8 -3.5 0 -3.5 Z" fill="#f9a8d4" opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="145,28; 176,56; 204,84" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.78;0.55;0" dur="7.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -3 C 2.4 -3 3.4 -0.5 2.2 2.4 C 0.9 3.2 -0.9 3.2 -2.2 2.4 C -3.4 -0.5 -2.4 -3 0 -3 Z" fill="#fbcfe8" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="88,42; 118,68; 148,92" dur="8.6s" begin="-3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.72;0.5;0" dur="8.6s" begin="-3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -3.2 C 2.5 -3.2 3.6 -0.6 2.4 2.6 C 1 3.4 -1 3.4 -2.4 2.6 C -3.6 -0.6 -2.5 -3.2 0 -3.2 Z" fill="#fff1f2" opacity="0.72">
        <animateTransform attributeName="transform" type="translate" values="1118,32; 1094,58; 1070,84" dur="8.2s" begin="-5.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0.5;0" dur="8.2s" begin="-5.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 10 Floating Sakura Petals on the Pond with Soft Water Ripples -->
    <g>
      <!-- Petal 1 with soft ripple -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 10,1.2; 0,0" dur="8.8s" repeatCount="indefinite"/>
        <ellipse cx="165" cy="96" rx="11" ry="3.8" fill="none" stroke="#f9a8d4" stroke-width="0.7" opacity="0.22">
          <animate attributeName="rx" values="8;16;8" dur="5.2s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="2.8;5.2;2.8" dur="5.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.28;0.05;0.28" dur="5.2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="165" cy="96" rx="4.6" ry="2.1" fill="#f472b6" opacity="0.72"/>
      </g>

      <!-- Petal 2 -->
      <ellipse cx="290" cy="86" rx="5.4" ry="2.4" fill="#f9a8d4" opacity="0.76">
        <animateTransform attributeName="transform" type="translate" values="0,0; 11,1.4; 0,0" dur="9.2s" begin="-1.5s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Petal 3 -->
      <ellipse cx="368" cy="112" rx="3.6" ry="1.6" fill="#fbcfe8" opacity="0.64">
        <animateTransform attributeName="transform" type="translate" values="0,0; -8,1; 0,0" dur="7.2s" begin="-2.4s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Petal 4 with soft ripple -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 9,-1.2; 0,0" dur="8.4s" begin="-3.8s" repeatCount="indefinite"/>
        <ellipse cx="458" cy="103" rx="10" ry="3.4" fill="none" stroke="#fbcfe8" stroke-width="0.65" opacity="0.2">
          <animate attributeName="rx" values="7;15;7" dur="5.8s" begin="-1.8s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="2.4;4.8;2.4" dur="5.8s" begin="-1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.25;0.04;0.25" dur="5.8s" begin="-1.8s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="458" cy="103" rx="4.2" ry="1.9" fill="#f9a8d4" opacity="0.68"/>
      </g>

      <!-- Petal 5 -->
      <ellipse cx="735" cy="82" rx="3.8" ry="1.7" fill="#fff1f2" opacity="0.68">
        <animateTransform attributeName="transform" type="translate" values="0,0; -9,1; 0,0" dur="6.8s" begin="-0.9s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Petal 6 with soft ripple -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; -11,1.5; 0,0" dur="9.8s" begin="-4.5s" repeatCount="indefinite"/>
        <ellipse cx="865" cy="96" rx="12" ry="4" fill="none" stroke="#f9a8d4" stroke-width="0.7" opacity="0.22">
          <animate attributeName="rx" values="8.5;17;8.5" dur="5.5s" begin="-2.6s" repeatCount="indefinite"/>
          <animate attributeName="ry" values="2.8;5.4;2.8" dur="5.5s" begin="-2.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.26;0.04;0.26" dur="5.5s" begin="-2.6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="865" cy="96" rx="5.0" ry="2.2" fill="#fbcfe8" opacity="0.74"/>
      </g>

      <!-- Petal 7 -->
      <ellipse cx="788" cy="114" rx="4.0" ry="1.8" fill="#f472b6" opacity="0.62">
        <animateTransform attributeName="transform" type="translate" values="0,0; 8,-1; 0,0" dur="7.6s" begin="-5.1s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Petal 8 -->
      <ellipse cx="972" cy="84" rx="4.4" ry="2.0" fill="#f9a8d4" opacity="0.72">
        <animateTransform attributeName="transform" type="translate" values="0,0; -10,1.2; 0,0" dur="8.6s" begin="-2.0s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Petal 9 -->
      <ellipse cx="1055" cy="108" rx="4.8" ry="2.1" fill="#fbcfe8" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; -7,-1.2; 0,0" dur="6.4s" begin="-3.3s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Petal 10 -->
      <ellipse cx="95" cy="113" rx="3.4" ry="1.5" fill="#fff1f2" opacity="0.62">
        <animateTransform attributeName="transform" type="translate" values="0,0; 7,0.8; 0,0" dur="6.2s" begin="-1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Subtle Sakura Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="123.5" rx="13.5" fill="none" stroke="#f9a8d4" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
